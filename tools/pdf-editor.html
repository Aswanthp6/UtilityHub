<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Editor - UtilityHub</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- PDF-lib Library -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

    <style>
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1e293b;
        }

        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        .pdf-page-container {
            position: relative;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            background-color: #ffffff;
            margin: 0 auto 2rem auto;
            transition: transform 0.1s ease-out;
        }

        .drawing-canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 20;
            touch-action: none;
        }

        .overlay-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 30;
            pointer-events: auto;
        }

        .pdf-interactive-element {
            position: absolute;
            pointer-events: auto;
            user-select: none;
            touch-action: none;
        }

        .tool-active {
            background-color: #2563eb !important;
            color: #ffffff !important;
            border-color: #a78bfa !important;
        }

        .modal-backdrop {
            background-color: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
        }

        /* Resize Handles */
        .resize-handle {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #8b5cf6;
            border: 1px solid #ffffff;
            border-radius: 2px;
            z-index: 40;
        }

        .resize-handle-nw {
            top: -5px;
            left: -5px;
            cursor: nwse-resize;
        }

        .resize-handle-ne {
            top: -5px;
            right: -5px;
            cursor: nesw-resize;
        }

        .resize-handle-sw {
            bottom: -5px;
            left: -5px;
            cursor: nesw-resize;
        }

        .resize-handle-se {
            bottom: -5px;
            right: -5px;
            cursor: nwse-resize;
        }

        /* UtilityHub theme */
        :root {
            --uh-bg: #0b0b12;
            --uh-panel: #11111a;
            --uh-panel-2: #151520;
            --uh-border: #292939;
            --uh-border-strong: #343448;
            --uh-accent: #8b5cf6;
            --uh-accent-soft: rgba(139, 92, 246, 0.16);
        }

        .utilityhub-pdf-editor {
            background: var(--uh-bg);
            color: #fff;
        }

        .selection-hint {
            font-size: 10px;
            color: #9ca3af;
            white-space: nowrap;
        }

        .utilityhub-pdf-editor>header {
            height: 70px !important;
            background: #101018 !important;
            border-bottom: 1px solid #242432 !important;
            padding: 0 30px !important;
        }

        #main-toolbar {
            min-height: 60px;
            height: auto !important;
            background: var(--uh-panel-2) !important;
            border-bottom: 1px solid var(--uh-border) !important;
            padding: 10px 15px !important;
            align-items: flex-start !important;
        }

        #main-toolbar>div {
            flex-wrap: wrap;
        }

        #main-toolbar .tool-btn,
        #main-toolbar button,
        #main-toolbar label {
            border-radius: 9px;
        }

        #main-toolbar .tool-btn.tool-active {
            background: var(--uh-accent) !important;
            border-color: var(--uh-accent) !important;
            color: #fff !important;
        }

        #main-toolbar .tool-btn:hover,
        #main-toolbar label:hover {
            background: #252536 !important;
        }

        #main-toolbar select,
        #main-toolbar input[type="color"] {
            background: #20202d !important;
            border-color: var(--uh-border-strong) !important;
            color: #fff;
        }

        #sidebar {
            background: #101018 !important;
            border-right: 1px solid var(--uh-border) !important;
        }

        #viewport {
            background: #0b0b12 !important;
        }

        #drop-zone {
            border-color: #38384a !important;
            background: #11111a !important;
            border-radius: 18px !important;
        }

        #drop-zone:hover {
            border-color: var(--uh-accent) !important;
        }

        #drop-zone .text-violet-400 {
            color: var(--uh-accent) !important;
        }

        #shapes-menu {
            pointer-events: auto !important;
            min-width: 190px;
        }

        #shapes-menu .shape-option:hover,
        #shapes-menu .shape-option.bg-violet-900\/50 {
            background: rgba(139, 92, 246, 0.18) !important;
        }

        #shapes-menu .shape-option {
            color: #ddd !important;
        }

        #shapes-menu .shape-option:hover {
            color: #fff !important;
        }

        #thumbnail-container>div {
            border-color: #343448 !important;
        }

        #thumbnail-container>div:hover {
            border-color: var(--uh-accent) !important;
        }

        #btn-export {
            background: var(--uh-accent) !important;
            border-color: var(--uh-accent) !important;
            box-shadow: 0 8px 24px rgba(139, 92, 246, .18) !important;
        }

        #btn-export:hover {
            background: #7c3aed !important;
            border-color: #7c3aed !important;
        }

        #signature-modal .bg-slate-800 {
            background: #151520 !important;
            border-color: #343448 !important;
        }

        @media (max-width: 900px) {
            .utilityhub-pdf-editor>header {
                padding: 0 15px !important;
            }

            #main-toolbar {
                padding: 8px 10px !important;
            }
        }

        .text-format-btn {
            min-width: 26px;
            height: 24px;
            padding: 0 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
        }

        .text-format-btn.is-active {
            background: rgba(139, 92, 246, 0.28) !important;
            color: #fff !important;
            border-color: rgba(139, 92, 246, 0.8) !important;
        }

        .text-format-btn:disabled,
        #text-align:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
    </style>
</head>

<body class="h-full flex flex-col font-sans overflow-hidden select-none utilityhub-pdf-editor">

    <!-- Main Header / Navigation -->
    <header class="h-14 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-4 z-40 shrink-0">
        <!-- Brand / Logo -->
        <div class="flex items-center space-x-3">
            <div
                class="w-9 h-9 rounded-lg bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white font-bold text-lg shadow-md">
                <i class="fas fa-file-pdf"></i>
            </div>
            <div>
                <h1 class="font-bold text-base tracking-wide leading-tight text-white">Utility<span
                        class="text-violet-400">Hub</span></h1>
                <div class="text-[11px] text-slate-400 leading-tight">PDF Editor</div>
            </div>
        </div>

        <!-- Document Navigation & Zoom Controls -->
        <div class="flex items-center space-x-2 bg-slate-900/80 px-3 py-1.5 rounded-lg border border-slate-700/60">
            <button id="btn-prev"
                class="p-1.5 hover:bg-slate-700 rounded text-slate-300 hover:text-white transition disabled:opacity-40"
                title="Previous Page">
                <i class="fas fa-chevron-left text-xs"></i>
            </button>
            <span class="text-xs text-slate-300 font-mono px-1">
                Page <input id="page-num-input" type="number" min="1" value="1"
                    class="w-10 bg-slate-800 text-center border border-slate-600 rounded px-1 py-0.5 text-xs text-white focus:outline-none focus:border-violet-500">
                / <span id="page-count">0</span>
            </span>
            <button id="btn-next"
                class="p-1.5 hover:bg-slate-700 rounded text-slate-300 hover:text-white transition disabled:opacity-40"
                title="Next Page">
                <i class="fas fa-chevron-right text-xs"></i>
            </button>
            <div class="h-4 w-px bg-slate-700 mx-1"></div>
            <button id="btn-zoom-out"
                class="p-1.5 hover:bg-slate-700 rounded text-slate-300 hover:text-white transition" title="Zoom Out">
                <i class="fas fa-search-minus text-xs"></i>
            </button>
            <span id="zoom-value" class="text-xs font-mono text-slate-300 w-12 text-center">100%</span>
            <button id="btn-zoom-in" class="p-1.5 hover:bg-slate-700 rounded text-slate-300 hover:text-white transition"
                title="Zoom In">
                <i class="fas fa-search-plus text-xs"></i>
            </button>
            <button id="btn-zoom-fit"
                class="p-1.5 hover:bg-slate-700 rounded text-slate-300 hover:text-white transition ml-1"
                title="Fit to Width">
                <i class="fas fa-expand text-xs"></i>
            </button>
        </div>

        <!-- Header Right Actions: History, Page Operations, Open & Export -->
        <div class="flex items-center space-x-2">
            <a href="../index.html"
                class="hidden lg:flex items-center px-3 py-1.5 text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-700 rounded-lg transition border border-transparent hover:border-slate-600"
                title="Back to UtilityHub">
                <i class="fas fa-arrow-left mr-1.5"></i> Back to Tools
            </a>
            <!-- Undo / Redo -->
            <button id="btn-undo"
                class="p-2 bg-slate-700/60 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-medium transition flex items-center space-x-1 border border-slate-600/50"
                title="Undo (Ctrl+Z)">
                <i class="fas fa-undo"></i>
                <span class="hidden sm:inline">Undo</span>
            </button>
            <button id="btn-redo"
                class="p-2 bg-slate-700/60 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-medium transition flex items-center space-x-1 border border-slate-600/50"
                title="Redo (Ctrl+Y)">
                <i class="fas fa-redo"></i>
                <span class="hidden sm:inline">Redo</span>
            </button>

            <div class="h-4 w-px bg-slate-700 mx-0.5"></div>

            <!-- Add Blank Page -->
            <button id="btn-add-blank-page"
                class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-xs font-medium transition flex items-center space-x-1.5 border border-slate-600"
                title="Add New Blank Page">
                <i class="fas fa-file-circle-plus text-emerald-400"></i>
                <span class="hidden md:inline">Blank Page</span>
            </button>

            <!-- Duplicate Current Page -->
            <button id="btn-duplicate-page"
                class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-xs font-medium transition flex items-center space-x-1.5 border border-slate-600"
                title="Duplicate Current Page">
                <i class="fas fa-copy text-violet-400"></i>
                <span class="hidden md:inline">Duplicate</span>
            </button>

            <!-- Merge PDF -->
            <label
                class="cursor-pointer px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-xs font-medium transition flex items-center space-x-1.5 border border-slate-600"
                title="Merge additional PDF file">
                <i class="fas fa-file-import text-amber-400"></i>
                <span class="hidden md:inline">Merge PDF</span>
                <input type="file" id="merge-file-input" accept="application/pdf" class="hidden">
            </label>

            <!-- Open PDF -->
            <label
                class="cursor-pointer px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-xs font-medium transition flex items-center space-x-1.5 border border-slate-600">
                <i class="fas fa-folder-open text-violet-400"></i>
                <span class="hidden sm:inline">Open PDF</span>
                <input type="file" id="file-input" accept="application/pdf" class="hidden">
            </label>

            <!-- Export PDF -->
            <button id="btn-export"
                class="px-4 py-1.5 bg-violet-600 hover:bg-violet-500 text-white font-medium rounded-lg text-xs transition shadow-md shadow-violet-900/30 flex items-center space-x-1.5">
                <i class="fas fa-download"></i>
                <span>Export</span>
            </button>
        </div>
    </header>

    <!-- Secondary Action Toolbar -->
    <div id="main-toolbar"
        class="h-12 bg-slate-800/90 border-b border-slate-700/80 px-4 flex items-center justify-between shrink-0 overflow-x-auto gap-2 z-30">
        <!-- Annotation Tools -->
        <div class="flex items-center space-x-1">
            <button data-tool="select"
                class="tool-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-700 hover:text-white transition flex items-center space-x-1.5 tool-active"
                title="Select & Move (V)">
                <i class="fas fa-mouse-pointer"></i>
                <span>Select</span>
            </button>

            <button data-tool="text"
                class="tool-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-700 hover:text-white transition flex items-center space-x-1.5"
                title="Add Text (T)">
                <i class="fas fa-font"></i>
                <span>Text</span>
            </button>

            <button data-tool="pen"
                class="tool-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-700 hover:text-white transition flex items-center space-x-1.5"
                title="Freehand Pen (P)">
                <i class="fas fa-pen"></i>
                <span>Pen</span>
            </button>

            <button data-tool="highlighter"
                class="tool-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-700 hover:text-white transition flex items-center space-x-1.5"
                title="Highlighter">
                <i class="fas fa-highlighter"></i>
                <span>Highlight</span>
            </button>

            <button data-tool="eraser"
                class="tool-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-700 hover:text-white transition flex items-center space-x-1.5"
                title="Eraser Mode">
                <i class="fas fa-eraser"></i>
                <span>Eraser</span>
            </button>
            <button id="btn-clear-markings"
                class="px-3 py-1.5 rounded-lg text-xs font-medium text-red-300 hover:bg-red-900/40 hover:text-white transition flex items-center space-x-1.5"
                title="Clear markings on current page">
                <i class="fas fa-trash"></i>
                <span>Clear</span>
            </button>

            <!-- Shapes Dropdown Container -->
            <div class="relative">
                <button id="btn-shapes-dropdown"
                    class="tool-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-700 hover:text-white transition flex items-center space-x-1.5 border border-transparent">
                    <i class="fas fa-shapes"></i>
                    <span id="shape-btn-label">Shapes</span>
                    <i class="fas fa-chevron-down text-[10px] ml-0.5 opacity-70"></i>
                </button>

                <!-- Shapes Dropdown Menu -->
                <div id="shapes-menu"
                    class="hidden fixed w-48 bg-[#151520] border border-[#343448] rounded-xl shadow-2xl py-1 z-[10000] text-xs">
                    <button type="button" data-shape="rectangle"
                        class="shape-option w-full px-3 py-2 text-left text-slate-200 hover:bg-slate-700 flex items-center space-x-2">
                        <i class="far fa-square text-violet-400 w-4"></i>
                        <span>Rectangle</span>
                    </button>
                    <button type="button" data-shape="circle"
                        class="shape-option w-full px-3 py-2 text-left text-slate-200 hover:bg-slate-700 flex items-center space-x-2">
                        <i class="far fa-circle text-violet-400 w-4"></i>
                        <span>Circle</span>
                    </button>
                    <button type="button" data-shape="line"
                        class="shape-option w-full px-3 py-2 text-left text-slate-200 hover:bg-slate-700 flex items-center space-x-2">
                        <i class="fas fa-minus text-violet-400 w-4"></i>
                        <span>Line</span>
                    </button>
                    <button type="button" data-shape="arrow"
                        class="shape-option w-full px-3 py-2 text-left text-slate-200 hover:bg-slate-700 flex items-center space-x-2">
                        <i class="fas fa-long-arrow-alt-right text-violet-400 w-4"></i>
                        <span>Arrow</span>
                    </button>
                    <div class="h-px bg-slate-700 my-1"></div>
                    <button type="button" data-shape="redact"
                        class="shape-option w-full px-3 py-2 text-left text-red-400 hover:bg-slate-700 flex items-center space-x-2">
                        <i class="fas fa-vector-square text-red-400 w-4"></i>
                        <span>Redact / Whiteout</span>
                    </button>
                </div>
            </div>

            <button id="btn-signature-modal"
                class="px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-700 hover:text-white transition flex items-center space-x-1.5">
                <i class="fas fa-signature text-amber-400"></i>
                <span>Signature</span>
            </button>

            <label
                class="cursor-pointer px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-700 hover:text-white transition flex items-center space-x-1.5">
                <i class="fas fa-image text-emerald-400"></i>
                <span>Image</span>
                <input type="file" id="image-upload-input" accept="image/png, image/jpeg" class="hidden">
            </label>
        </div>

        <!-- Tool Properties Controls -->
        <div class="flex items-center space-x-3 bg-slate-900/60 px-3 py-1 rounded-lg border border-slate-700/50">
            <!-- Eraser Mode -->
            <div id="eraser-mode-control" class="hidden items-center space-x-1.5">
                <label class="text-[11px] text-slate-400 font-medium">Eraser</label>
                <select id="eraser-mode"
                    class="bg-slate-800 text-white text-[11px] border border-slate-700 rounded px-1.5 py-0.5 focus:outline-none">
                    <option value="partial">Partial erase</option>
                    <option value="stroke">Erase whole stroke</option>
                    <option value="last">Erase last touched</option>
                </select>
            </div>

            <!-- Color Picker -->
            <div class="flex items-center space-x-1.5">
                <label class="text-[11px] text-slate-400 font-medium">Color</label>
                <input type="color" id="primary-color" value="#2563eb"
                    class="w-6 h-6 rounded cursor-pointer border-0 bg-transparent p-0">
            </div>

            <!-- Brush Width -->
            <div class="flex items-center space-x-1.5">
                <label class="text-[11px] text-slate-400 font-medium">Width</label>
                <input type="range" id="brush-size" min="1" max="20" value="3" class="w-16">
                <span id="brush-size-value" class="text-[10px] text-slate-400 w-5 text-center">3</span>
            </div>

            <!-- Highlight Opacity -->
            <div class="flex items-center space-x-1.5">
                <label class="text-[11px] text-slate-400 font-medium">Opacity</label>
                <input type="range" id="highlight-opacity" min="10" max="100" value="35" class="w-16">
                <span id="highlight-opacity-value" class="text-[10px] text-slate-400 w-8 text-center">35%</span>
            </div>

            <!-- Shape Stroke Width -->
            <div class="flex items-center space-x-1.5">
                <label class="text-[11px] text-slate-400 font-medium">Stroke</label>
                <input type="range" id="stroke-width" min="1" max="15" value="3" class="w-16">
                <span id="stroke-width-value" class="text-[10px] text-slate-400 w-5 text-center">3</span>
            </div>

            <!-- Shape Fill -->
            <div id="shape-fill-control" class="hidden items-center space-x-1.5 border-l border-slate-700 pl-3">
                <label class="flex items-center space-x-1 text-[11px] text-slate-400 font-medium cursor-pointer"
                    title="Fill rectangle or circle interiors">
                    <input type="checkbox" id="shape-fill-enabled" class="accent-violet-500">
                    <span>Fill</span>
                </label>
                <input type="color" id="shape-fill-color" value="#8b5cf6"
                    class="w-6 h-6 rounded cursor-pointer border-0 bg-transparent p-0" title="Shape fill color">
            </div>

            <!-- Font Size / Thickness -->
            <div class="flex items-center space-x-1.5">
                <label class="text-[11px] text-slate-400 font-medium">Size</label>
                <select id="font-size"
                    class="bg-slate-800 text-white text-xs border border-slate-700 rounded px-1.5 py-0.5 focus:outline-none">
                    <option value="12">12px</option>
                    <option value="16" selected>16px</option>
                    <option value="20">20px</option>
                    <option value="24">24px</option>
                    <option value="32">32px</option>
                    <option value="48">48px</option>
                </select>
            </div>

            <!-- Font Family -->
            <div class="flex items-center space-x-1.5">
                <label class="text-[11px] text-slate-400 font-medium">Font</label>
                <select id="font-family"
                    class="bg-slate-800 text-white text-xs border border-slate-700 rounded px-1.5 py-0.5 focus:outline-none">
                    <option value="sans-serif">Sans-Serif</option>
                    <option value="serif">Serif</option>
                    <option value="monospace">Monospace</option>
                </select>
            </div>

            <!-- Text Formatting -->
            <div class="flex items-center space-x-1 border-l border-slate-700 pl-3">
                <button id="font-bold-btn" type="button"
                    class="text-format-btn text-slate-300 border border-slate-700 hover:bg-slate-700" title="Bold">
                    <strong>B</strong>
                </button>
                <button id="font-italic-btn" type="button"
                    class="text-format-btn text-slate-300 border border-slate-700 hover:bg-slate-700" title="Italic">
                    <em>I</em>
                </button>
                <button id="font-underline-btn" type="button"
                    class="text-format-btn text-slate-300 border border-slate-700 hover:bg-slate-700" title="Underline">
                    <u>U</u>
                </button>
                <select id="text-align"
                    class="bg-slate-800 text-white text-xs border border-slate-700 rounded px-1.5 py-0.5 focus:outline-none"
                    title="Text alignment">
                    <option value="left">Left</option>
                    <option value="center">Center</option>
                    <option value="right">Right</option>
                </select>
            </div>

            <!-- Delete Selected Element Button -->
            <button id="btn-delete-selected"
                class="p-1 px-2 bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white rounded text-xs transition flex items-center space-x-1 border border-red-500/30"
                title="Delete Selected Item">
                <i class="fas fa-trash-alt"></i>
                <span class="hidden lg:inline text-[11px]">Delete</span>
            </button>
            <span class="selection-hint hidden xl:inline">Select an object to move or resize</span>
        </div>
    </div>

    <!-- Main Editor Area -->
    <div class="flex-1 flex overflow-hidden relative">

        <!-- Sidebar / Thumbnail Panel -->
        <aside id="sidebar"
            class="w-48 bg-slate-800/50 border-r border-slate-700/80 p-3 flex flex-col hidden md:flex shrink-0">
            <div
                class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 flex items-center justify-between">
                <span>Thumbnails</span>
                <i class="fas fa-th-large text-slate-500"></i>
            </div>
            <div id="thumbnail-container" class="flex-1 overflow-y-auto space-y-3 pr-1">
                <!-- Dynamic Page Thumbnails inserted here -->
            </div>
        </aside>

        <!-- Main Viewport Container -->
        <main id="viewport"
            class="flex-1 overflow-auto bg-slate-950 p-6 flex flex-col items-center justify-start relative">

            <!-- Blank State Drop Zone (Visible when no document loaded) -->
            <div id="drop-zone"
                class="m-auto max-w-md w-full border-2 border-dashed border-slate-700 hover:border-violet-500 rounded-2xl p-8 text-center transition bg-slate-900/50 cursor-pointer">
                <div
                    class="w-16 h-16 rounded-full bg-violet-600/10 text-violet-400 flex items-center justify-center mx-auto mb-4 text-2xl">
                    <i class="fas fa-cloud-upload-alt"></i>
                </div>
                <h3 class="text-lg font-semibold text-white mb-1">Open or Create PDF</h3>
                <p class="text-xs text-slate-400 mb-4">Drag and drop your PDF file here, browse from your computer, or
                    start with a blank page.</p>
                <div class="flex items-center justify-center space-x-3">
                    <button onclick="document.getElementById('file-input').click()"
                        class="px-4 py-2 bg-violet-600 hover:bg-violet-500 text-white font-medium rounded-lg text-xs transition shadow-md">
                        Browse File
                    </button>
                    <button id="btn-create-blank-start"
                        class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white font-medium rounded-lg text-xs transition border border-slate-600">
                        Create Blank PDF
                    </button>
                </div>
            </div>

            <!-- Render Wrapper for Page Canvases -->
            <div id="pdf-render-wrapper" class="relative hidden">
                <!-- Rendered PDF Page Container will be appended here -->
            </div>

        </main>
    </div>

    <!-- Signature Modal -->
    <div id="signature-modal" class="fixed inset-0 modal-backdrop hidden z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-xl shadow-2xl max-w-md w-full overflow-hidden">
            <div class="px-4 py-3 border-b border-slate-700 flex items-center justify-between">
                <h3 class="font-semibold text-white text-sm flex items-center space-x-2">
                    <i class="fas fa-signature text-amber-400"></i>
                    <span>Draw Signature</span>
                </h3>
                <button id="btn-close-sig-modal" class="text-slate-400 hover:text-white">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-4">
                <div class="border border-slate-600 rounded-lg bg-white overflow-hidden mb-3">
                    <canvas id="signature-pad" width="400" height="160" class="w-full h-40 cursor-crosshair"></canvas>
                </div>
                <div class="flex items-center justify-between">
                    <button id="btn-clear-sig"
                        class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs rounded transition">
                        Clear
                    </button>
                    <button id="btn-save-sig"
                        class="px-4 py-1.5 bg-violet-600 hover:bg-violet-500 text-white text-xs font-medium rounded shadow transition">
                        Apply Signature
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize PDF.js Worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // Global Application State
        let pdfDoc = null;
        let originalPdfBytes = null;
        let currentPageNum = 1;
        let totalPages = 0;
        let scale = 1.2;
        let currentTool = 'select'; // 'select', 'text', 'pen', 'highlighter', 'eraser', 'shape'
        let currentShape = 'rectangle';

        // Tool Styling State
        let primaryColor = '#8b5cf6';
        let fontSize = 16;
        let fontFamily = 'sans-serif';
        let fontBold = false;
        let fontItalic = false;
        let fontUnderline = false;
        let textAlign = 'left';
        let brushSize = 3;
        let highlightOpacity = 0.35;
        let strokeWidth = 3;
        let shapeFillColor = '#8b5cf6';
        let shapeFillEnabled = false;
        let eraserMode = 'partial';

        // Page Elements & Undo/Redo History
        let pageElements = {}; // { pageNum: [ elements ] }
        let selectedElementId = null;
        let historyStack = [];
        let historyStep = -1;

        // Freehand Drawing State
        let isDrawing = false;
        let currentPath = [];
        let pageDrawings = {}; // { pageNum: [ pathObjects ] }

        document.addEventListener('DOMContentLoaded', () => {
            initUI();
            setupGlobalKeyListeners();
            setupPDFDrop();
            setupSignaturePad();
        });

        function initUI() {
            // File Input Listener (Open PDF)
            document.getElementById('file-input').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) handleFileUpload(file);
            });

            // Merge File Input Listener
            document.getElementById('merge-file-input').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) handleMergePDF(file);
            });

            // Add Blank Page Button
            document.getElementById('btn-add-blank-page').addEventListener('click', addBlankPage);
            document.getElementById('btn-duplicate-page').addEventListener('click', duplicateCurrentPage);
            document.getElementById('btn-create-blank-start').addEventListener('click', createBlankDocument);

            // Tool Switching buttons
            const toolButtons = document.querySelectorAll('[data-tool]');
            toolButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const tool = btn.getAttribute('data-tool');
                    if (tool) setTool(tool);
                });
            });

            // Color and Font Controls
            document.getElementById('primary-color').addEventListener('input', (e) => {
                primaryColor = e.target.value;
                if (selectedElementId) {
                    updateSelectedElementProperty('color', primaryColor);
                }
            });
            document.getElementById('font-size').addEventListener('change', (e) => {
                fontSize = parseInt(e.target.value) || 16;
                if (selectedElementId) {
                    updateSelectedElementProperty('fontSize', fontSize);
                }
            });
            document.getElementById('font-family').addEventListener('change', (e) => {
                fontFamily = e.target.value;
                if (selectedElementId) {
                    updateSelectedElementProperty('fontFamily', fontFamily);
                }
            });

            [
                ['font-bold-btn', 'fontBold'],
                ['font-italic-btn', 'fontItalic'],
                ['font-underline-btn', 'fontUnderline']
            ].forEach(([id, prop]) => {
                document.getElementById(id).addEventListener('click', () => {
                    const newValue = !({ fontBold, fontItalic, fontUnderline }[prop]);
                    if (prop === 'fontBold') fontBold = newValue;
                    if (prop === 'fontItalic') fontItalic = newValue;
                    if (prop === 'fontUnderline') fontUnderline = newValue;
                    if (selectedElementId) updateSelectedElementProperty(prop, newValue);
                    syncTextFormatUI();
                });
            });

            document.getElementById('text-align').addEventListener('change', (e) => {
                textAlign = e.target.value;
                if (selectedElementId) updateSelectedElementProperty('textAlign', textAlign);
            });

            document.getElementById('brush-size').addEventListener('input', (e) => {
                brushSize = parseInt(e.target.value) || 3;
                document.getElementById('brush-size-value').textContent = brushSize;
            });

            document.getElementById('eraser-mode').addEventListener('change', (e) => {
                eraserMode = e.target.value;
            });

            document.getElementById('highlight-opacity').addEventListener('input', (e) => {
                highlightOpacity = (parseInt(e.target.value) || 35) / 100;
                document.getElementById('highlight-opacity-value').textContent = `${Math.round(highlightOpacity * 100)}%`;
            });

            document.getElementById('stroke-width').addEventListener('input', (e) => {
                strokeWidth = parseInt(e.target.value) || 3;
                document.getElementById('stroke-width-value').textContent = strokeWidth;
                if (selectedElementId) {
                    const el = (pageElements[currentPageNum] || []).find(item => item.id === selectedElementId);
                    if (el && el.type === 'shape') updateSelectedElementProperty('strokeWidth', strokeWidth);
                }
            });

            document.getElementById('shape-fill-enabled').addEventListener('change', (e) => {
                shapeFillEnabled = e.target.checked;
                syncShapeFillUI();
                if (selectedElementId) {
                    const el = (pageElements[currentPageNum] || []).find(item => item.id === selectedElementId);
                    if (el && el.type === 'shape' && (el.shapeType === 'rectangle' || el.shapeType === 'circle')) {
                        updateSelectedElementProperty('fillEnabled', shapeFillEnabled);
                    }
                }
            });

            document.getElementById('shape-fill-color').addEventListener('input', (e) => {
                shapeFillColor = e.target.value;
                if (selectedElementId) {
                    const el = (pageElements[currentPageNum] || []).find(item => item.id === selectedElementId);
                    if (el && el.type === 'shape' && (el.shapeType === 'rectangle' || el.shapeType === 'circle')) {
                        updateSelectedElementProperty('fillColor', shapeFillColor);
                    }
                }
            });

            document.getElementById('btn-clear-markings').addEventListener('click', clearCurrentPageMarkings);

            // Delete Selected Item Button
            document.getElementById('btn-delete-selected').addEventListener('click', () => {
                deleteSelectedElement();
            });

            // Shapes Menu Toggle & Handlers
            const shapesBtn = document.getElementById('btn-shapes-dropdown');
            const shapesMenu = document.getElementById('shapes-menu');
            const shapeButtonLabel = document.getElementById('shape-btn-label');

            // Portal the shapes menu to <body> so it cannot be clipped by the scrolling toolbar
            // or covered by the PDF page overlay after a document is loaded.
            if (shapesMenu.parentElement !== document.body) {
                document.body.appendChild(shapesMenu);
            }

            function positionShapesMenu() {
                if (shapesMenu.classList.contains('hidden')) return;
                const rect = shapesBtn.getBoundingClientRect();
                const menuWidth = 192;
                const menuHeight = shapesMenu.offsetHeight || 190;
                let left = rect.left;
                let top = rect.bottom + 6;

                if (left + menuWidth > window.innerWidth - 8) {
                    left = window.innerWidth - menuWidth - 8;
                }
                if (top + menuHeight > window.innerHeight - 8) {
                    top = Math.max(8, rect.top - menuHeight - 6);
                }

                shapesMenu.style.left = `${Math.max(8, left)}px`;
                shapesMenu.style.top = `${top}px`;
            }

            function closeShapesMenu() {
                shapesMenu.classList.add('hidden');
            }

            shapesBtn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                const willOpen = shapesMenu.classList.contains('hidden');
                if (willOpen) {
                    shapesMenu.classList.remove('hidden');
                    positionShapesMenu();
                } else {
                    closeShapesMenu();
                }
            });

            // Event delegation keeps every shape option clickable even when the menu is portaled.
            shapesMenu.addEventListener('click', (e) => {
                const btn = e.target.closest('[data-shape]');
                if (!btn || !shapesMenu.contains(btn)) return;
                e.preventDefault();
                e.stopPropagation();

                currentShape = btn.dataset.shape;
                const labels = { rectangle: 'Rectangle', circle: 'Circle', line: 'Line', arrow: 'Arrow', redact: 'Redact' };
                shapeButtonLabel.textContent = labels[currentShape] || 'Shapes';

                shapesMenu.querySelectorAll('[data-shape]').forEach(option => {
                    option.classList.toggle('bg-violet-900/50', option === btn);
                    option.classList.toggle('text-white', option === btn);
                });

                setTool('shape');
                syncShapeFillUI();
                closeShapesMenu();
            });

            document.addEventListener('click', (e) => {
                if (!shapesMenu.contains(e.target) && !shapesBtn.contains(e.target)) {
                    closeShapesMenu();
                }
            });

            window.addEventListener('resize', positionShapesMenu);
            window.addEventListener('scroll', positionShapesMenu, true);

            // Zoom Controls
            document.getElementById('btn-zoom-in').addEventListener('click', () => adjustZoom(0.15));
            document.getElementById('btn-zoom-out').addEventListener('click', () => adjustZoom(-0.15));
            document.getElementById('btn-zoom-fit').addEventListener('click', () => setZoom(1.0));

            // Navigation Controls
            document.getElementById('btn-prev').addEventListener('click', () => changePage(-1));
            document.getElementById('btn-next').addEventListener('click', () => changePage(1));
            document.getElementById('page-num-input').addEventListener('change', (e) => {
                const p = parseInt(e.target.value);
                if (p >= 1 && p <= totalPages) {
                    currentPageNum = p;
                    renderPage(currentPageNum);
                }
            });

            // Undo / Redo
            document.getElementById('btn-undo').addEventListener('click', undo);
            document.getElementById('btn-redo').addEventListener('click', redo);

            // Export Button
            document.getElementById('btn-export').addEventListener('click', exportPDF);

            // Image Upload
            document.getElementById('image-upload-input').addEventListener('change', handleImageUpload);
        }

        function syncTextFormatUI() {
            document.getElementById('font-bold-btn')?.classList.toggle('is-active', fontBold);
            document.getElementById('font-italic-btn')?.classList.toggle('is-active', fontItalic);
            document.getElementById('font-underline-btn')?.classList.toggle('is-active', fontUnderline);
            const align = document.getElementById('text-align');
            if (align) align.value = textAlign;
        }

        function syncTextFormatFromElement(el) {
            if (!el || el.type !== 'text') {
                syncTextFormatUI();
                return;
            }
            fontBold = !!el.fontBold;
            fontItalic = !!el.fontItalic;
            fontUnderline = !!el.fontUnderline;
            textAlign = el.textAlign || 'left';
            syncTextFormatUI();
        }

        function setupGlobalKeyListeners() {
            document.addEventListener('keydown', (e) => {
                const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
                const isContentEditable = document.activeElement && document.activeElement.isContentEditable;

                if (activeTag === 'input' || activeTag === 'textarea' || isContentEditable) {
                    return;
                }

                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                    e.preventDefault();
                    if (e.shiftKey) redo(); else undo();
                } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
                    e.preventDefault();
                    redo();
                } else if (e.key === 'Delete' || e.key === 'Backspace') {
                    if (selectedElementId) {
                        e.preventDefault();
                        deleteSelectedElement();
                    }
                } else if (e.key.toLowerCase() === 'v') setTool('select');
                else if (e.key.toLowerCase() === 't') setTool('text');
                else if (e.key.toLowerCase() === 'p') setTool('pen');
            });

            // Deselect when clicking empty background space
            document.addEventListener('mousedown', (e) => {
                const isInsideElement = e.target.closest('.pdf-interactive-element');
                const isInsideToolbar = e.target.closest('#main-toolbar') || e.target.closest('header') || e.target.closest('.modal-backdrop');

                if (!isInsideElement && !isInsideToolbar) {
                    deselectAllElements();
                }
            });
        }

        function setupPDFDrop() {
            const dropZone = document.getElementById('drop-zone');
            const viewport = document.getElementById('viewport');

            [dropZone, viewport].forEach(target => {
                target.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                });
                target.addEventListener('drop', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                        const file = e.dataTransfer.files[0];
                        if (file.type === 'application/pdf' || file.name.endsWith('.pdf')) {
                            handleFileUpload(file);
                        }
                    }
                });
            });
        }


        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.classList.remove('tool-active');
            });

            const activeBtn = document.querySelector(`[data-tool="${tool}"]`);
            if (activeBtn) activeBtn.classList.add('tool-active');

            const shapesBtn = document.getElementById('btn-shapes-dropdown');
            if (shapesBtn) {
                if (tool === 'shape') {
                    shapesBtn.classList.add('tool-active');
                } else {
                    shapesBtn.classList.remove('tool-active');
                }
            }

            // Adjust pointer events & z-index so pen/highlighter canvas receives input
            const isDrawingTool = (tool === 'pen' || tool === 'highlighter' || tool === 'eraser');
            const eraserModeControl = document.getElementById('eraser-mode-control');
            if (eraserModeControl) {
                eraserModeControl.classList.toggle('hidden', tool !== 'eraser');
                eraserModeControl.classList.toggle('flex', tool === 'eraser');
            }
            const shapeFillControl = document.getElementById('shape-fill-control');
            if (shapeFillControl) {
                const selectedEl = (pageElements[currentPageNum] || []).find(item => item.id === selectedElementId);
                const showShapeFill = tool === 'shape' || (selectedEl && selectedEl.type === 'shape');
                shapeFillControl.classList.toggle('hidden', !showShapeFill);
                shapeFillControl.classList.toggle('flex', !!showShapeFill);
            }
            syncShapeFillUI();
            const drawCanvases = document.querySelectorAll('.drawing-canvas');
            const overlayLayers = document.querySelectorAll('.overlay-layer');

            drawCanvases.forEach(dc => {
                dc.style.pointerEvents = isDrawingTool ? 'auto' : 'none';
                dc.style.zIndex = isDrawingTool ? '35' : '20';
            });

            overlayLayers.forEach(ol => {
                ol.style.pointerEvents = isDrawingTool ? 'none' : 'auto';
            });

            if (tool !== 'select') {
                deselectAllElements();
            }
        }

        function handleFileUpload(file) {
            const reader = new FileReader();
            reader.onload = function (evt) {
                originalPdfBytes = evt.target.result;
                loadPDFFromArrayBuffer(originalPdfBytes);
            };
            reader.readAsArrayBuffer(file);
        }

        async function handleMergePDF(file) {
            const reader = new FileReader();
            reader.onload = async function (evt) {
                try {
                    const secondaryBytes = evt.target.result;

                    let primaryPdfDocLib;
                    if (originalPdfBytes) {
                        primaryPdfDocLib = await PDFLib.PDFDocument.load(originalPdfBytes);
                    } else {
                        primaryPdfDocLib = await PDFLib.PDFDocument.create();
                    }

                    const secondaryPdfDocLib = await PDFLib.PDFDocument.load(secondaryBytes);
                    const copiedPages = await primaryPdfDocLib.copyPages(
                        secondaryPdfDocLib,
                        secondaryPdfDocLib.getPageIndices()
                    );

                    copiedPages.forEach(page => primaryPdfDocLib.addPage(page));

                    originalPdfBytes = await primaryPdfDocLib.save();
                    await loadPDFFromArrayBuffer(originalPdfBytes, true);
                } catch (err) {
                    console.error("Failed to merge PDF: ", err);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        async function duplicateCurrentPage() {
            if (!originalPdfBytes || !pdfDoc || !totalPages) {
                return;
            }

            try {
                const sourcePageNum = currentPageNum;
                const newPageNum = totalPages + 1;

                const pdfDocLib = await PDFLib.PDFDocument.load(originalPdfBytes);
                const copiedPages = await pdfDocLib.copyPages(pdfDocLib, [sourcePageNum - 1]);
                pdfDocLib.addPage(copiedPages[0]);

                // Duplicate editor elements with fresh IDs so the copied page is independent.
                if (pageElements[sourcePageNum]) {
                    pageElements[newPageNum] = pageElements[sourcePageNum].map(el => ({
                        ...JSON.parse(JSON.stringify(el)),
                        id: 'el_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8)
                    }));
                } else {
                    pageElements[newPageNum] = [];
                }

                if (pageDrawings[sourcePageNum]) {
                    pageDrawings[newPageNum] = JSON.parse(JSON.stringify(pageDrawings[sourcePageNum]));
                } else {
                    pageDrawings[newPageNum] = [];
                }

                originalPdfBytes = await pdfDocLib.save();
                currentPageNum = newPageNum;
                await loadPDFFromArrayBuffer(originalPdfBytes, true);

                const status = document.getElementById('status');
                if (status) {
                    status.textContent = `Page ${sourcePageNum} duplicated as page ${newPageNum}.`;
                    window.setTimeout(() => {
                        if (status.textContent === `Page ${sourcePageNum} duplicated as page ${newPageNum}.`) {
                            status.textContent = '';
                        }
                    }, 2500);
                }
            } catch (err) {
                console.error('Failed to duplicate page:', err);
            }
        }

        async function addBlankPage() {
            try {
                let pdfDocLib;
                if (originalPdfBytes) {
                    pdfDocLib = await PDFLib.PDFDocument.load(originalPdfBytes);
                } else {
                    pdfDocLib = await PDFLib.PDFDocument.create();
                }

                // Standard A4 dimensions (595.28 x 841.89 points)
                pdfDocLib.addPage([595.28, 841.89]);

                originalPdfBytes = await pdfDocLib.save();
                await loadPDFFromArrayBuffer(originalPdfBytes, true);

                // Jump to newly added page
                currentPageNum = totalPages;
                renderPage(currentPageNum);
            } catch (err) {
                console.error("Failed to add blank page: ", err);
            }
        }

        async function createBlankDocument() {
            originalPdfBytes = null;
            await addBlankPage();
        }

        async function loadPDFFromArrayBuffer(arrayBuffer, keepAnnotations = false) {
            try {
                const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer.slice(0) });
                pdfDoc = await loadingTask.promise;
                totalPages = pdfDoc.numPages;

                if (!keepAnnotations) {
                    currentPageNum = 1;
                    pageElements = {};
                    pageDrawings = {};
                    historyStack = [];
                    historyStep = -1;
                } else if (currentPageNum > totalPages) {
                    currentPageNum = totalPages;
                }

                document.getElementById('page-count').innerText = totalPages;
                document.getElementById('drop-zone').classList.add('hidden');
                document.getElementById('pdf-render-wrapper').classList.remove('hidden');

                renderSidebarThumbnails();
                renderPage(currentPageNum);
                if (!keepAnnotations) saveState();
            } catch (err) {
                console.error("Error loading PDF: ", err);
            }
        }

        async function renderPage(pageNum) {
            if (!pdfDoc) return;
            const renderWrapper = document.getElementById('pdf-render-wrapper');
            renderWrapper.innerHTML = '';

            const page = await pdfDoc.getPage(pageNum);
            const viewport = page.getViewport({ scale: scale });

            // Main Page Outer Container
            const pageContainer = document.createElement('div');
            pageContainer.className = 'pdf-page-container relative';
            pageContainer.style.width = `${viewport.width}px`;
            pageContainer.style.height = `${viewport.height}px`;

            // 1. PDF Base Canvas Layer
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            pageContainer.appendChild(canvas);

            // Render PDF page into base canvas
            await page.render({ canvasContext: ctx, viewport: viewport }).promise;

            // 2. Freehand Drawing Canvas Layer
            const isDrawingTool = (currentTool === 'pen' || currentTool === 'highlighter' || currentTool === 'eraser');
            const drawCanvas = document.createElement('canvas');
            drawCanvas.className = 'drawing-canvas';
            drawCanvas.width = viewport.width;
            drawCanvas.height = viewport.height;
            drawCanvas.style.pointerEvents = isDrawingTool ? 'auto' : 'none';
            drawCanvas.style.zIndex = isDrawingTool ? '35' : '20';
            pageContainer.appendChild(drawCanvas);

            // 3. Interactive Elements Overlay Layer
            const overlayLayer = document.createElement('div');
            overlayLayer.id = `overlay-layer-${pageNum}`;
            overlayLayer.className = 'overlay-layer';
            overlayLayer.style.pointerEvents = isDrawingTool ? 'none' : 'auto';
            pageContainer.appendChild(overlayLayer);

            renderWrapper.appendChild(pageContainer);

            // Attach Canvas Drawing Mouse/Touch Events
            setupDrawingEvents(drawCanvas, pageNum);

            // Single Click Handler on Overlay Layer to Add Elements
            overlayLayer.addEventListener('click', (e) => {
                if (e.target !== overlayLayer) return;

                const rect = overlayLayer.getBoundingClientRect();
                const x = (e.clientX - rect.left) / scale;
                const y = (e.clientY - rect.top) / scale;

                if (currentTool === 'text') {
                    addTextElement(pageNum, x, y);
                } else if (currentTool === 'shape') {
                    addShapeElement(pageNum, x, y, currentShape);
                } else if (currentTool === 'select') {
                    deselectAllElements();
                }
            });

            renderPageElements(pageNum);
            redrawCanvasPaths(drawCanvas, pageNum);
            updateNavControls();
        }

        function updateNavControls() {
            document.getElementById('page-num-input').value = currentPageNum;
            document.getElementById('btn-prev').disabled = currentPageNum <= 1;
            document.getElementById('btn-next').disabled = currentPageNum >= totalPages;
            document.getElementById('zoom-value').innerText = `${Math.round(scale * 100)}%`;
        }

        function changePage(delta) {
            const target = currentPageNum + delta;
            if (target >= 1 && target <= totalPages) {
                currentPageNum = target;
                renderPage(currentPageNum);
            }
        }

        function adjustZoom(delta) {
            scale = Math.max(0.5, Math.min(3.0, scale + delta));
            renderPage(currentPageNum);
        }

        function setZoom(val) {
            scale = val;
            renderPage(currentPageNum);
        }

        function addTextElement(pageNum, x, y) {
            const newEl = {
                id: 'el_' + Date.now(),
                type: 'text',
                x: x,
                y: y,
                width: 180,
                height: 60,
                text: 'Type text here...',
                color: primaryColor,
                fontSize: fontSize,
                fontFamily: fontFamily,
                fontBold: fontBold,
                fontItalic: fontItalic,
                fontUnderline: fontUnderline,
                textAlign: textAlign
            };

            if (!pageElements[pageNum]) pageElements[pageNum] = [];
            pageElements[pageNum].push(newEl);

            saveState();
            renderPageElements(pageNum);
            selectElement(newEl.id);

            // Focus text field automatically
            setTimeout(() => {
                const domEl = document.getElementById(`dom_${newEl.id}`);
                if (domEl) {
                    const textarea = domEl.querySelector('textarea');
                    if (textarea) {
                        textarea.focus();
                        textarea.select();
                    }
                }
            }, 50);

            setTool('select');
        }

        function syncShapeFillUI() {
            const control = document.getElementById('shape-fill-control');
            const checkbox = document.getElementById('shape-fill-enabled');
            const color = document.getElementById('shape-fill-color');
            if (!control || !checkbox || !color) return;

            const elements = pageElements[currentPageNum] || [];
            const selected = elements.find(item => item.id === selectedElementId);
            const shapeType = selected && selected.type === 'shape' ? selected.shapeType : currentShape;
            const supportsFill = shapeType === 'rectangle' || shapeType === 'circle';

            checkbox.disabled = !supportsFill;
            color.disabled = !supportsFill;
            if (!supportsFill) {
                checkbox.checked = false;
                color.style.opacity = '0.45';
            } else {
                color.style.opacity = '1';
                checkbox.checked = shapeFillEnabled;
            }
        }

        function addShapeElement(pageNum, x, y, shapeType) {
            const newEl = {
                id: 'el_' + Date.now(),
                type: 'shape',
                shapeType: shapeType,
                x: x,
                y: y,
                width: shapeType === 'line' || shapeType === 'arrow' ? 150 : 120,
                height: shapeType === 'line' || shapeType === 'arrow' ? 24 : 80,
                color: shapeType === 'redact' ? '#ffffff' : primaryColor,
                strokeWidth: strokeWidth,
                fillColor: shapeFillColor,
                fillEnabled: shapeType === 'rectangle' || shapeType === 'circle' ? shapeFillEnabled : false
            };

            if (!pageElements[pageNum]) pageElements[pageNum] = [];
            pageElements[pageNum].push(newEl);

            saveState();
            renderPageElements(pageNum);
            selectElement(newEl.id);
            setTool('select');
        }

        function updateSelectedElementProperty(prop, value) {
            if (!selectedElementId) return;
            const elements = pageElements[currentPageNum] || [];
            const el = elements.find(item => item.id === selectedElementId);
            if (el) {
                el[prop] = value;
                renderPageElements(currentPageNum);
                saveState();
            }
        }

        function renderPageElements(pageNum) {
            const overlayLayer = document.getElementById(`overlay-layer-${pageNum}`);
            if (!overlayLayer) return;

            overlayLayer.innerHTML = '';
            const elements = pageElements[pageNum] || [];

            elements.forEach(el => {
                if (el.type === 'text') {
                    overlayLayer.appendChild(createTextDOM(el));
                } else if (el.type === 'shape') {
                    overlayLayer.appendChild(createShapeDOM(el));
                } else if (el.type === 'image' || el.type === 'signature') {
                    overlayLayer.appendChild(createImageDOM(el));
                }
            });
        }

        function createTextDOM(el) {
            const isSelected = selectedElementId === el.id;

            const container = document.createElement('div');
            container.id = `dom_${el.id}`;
            container.className = `pdf-interactive-element cursor-move group flex flex-col ${isSelected ? 'ring-2 ring-violet-500 bg-violet-50/10' : 'hover:ring-1 hover:ring-violet-300'}`;
            container.style.left = `${el.x * scale}px`;
            container.style.top = `${el.y * scale}px`;
            container.style.width = `${el.width * scale}px`;
            container.style.minHeight = `${el.height * scale}px`;

            // Header Move Drag Handle
            const handle = document.createElement('div');
            handle.className = `drag-handle h-5 bg-violet-600 text-white flex items-center justify-between px-1 text-[10px] select-none rounded-t cursor-grab ${isSelected ? 'flex' : 'hidden group-hover:flex'}`;
            handle.innerHTML = `
        <span><i class="fas fa-grip-vertical mr-1"></i>Text</span>
        <button class="btn-del-el hover:text-red-300 ml-1"><i class="fas fa-times"></i></button>
      `;

            handle.querySelector('.btn-del-el').addEventListener('click', (e) => {

            // Native Textarea

            textarea.style.fontFamily = el.fontFamily;
            textarea.style.fontWeight = el.fontBold ? '700' : '400';
            textarea.style.fontStyle = el.fontItalic ? 'italic' : 'normal';
            textarea.style.textDecoration = el.fontUnderline ? 'underline' : 'none';
            textarea.style.textAlign = el.textAlign || 'left';
            textarea.value = el.text;

            // Stop propagation on inputs so typing keys work cleanly
            ['keydown', 'keyup', 'keypress', 'mousedown', 'mouseup', 'click', 'touchstart'].forEach(evt => {

            });

            textarea.addEventListener('input', (e) => {
                el.text = e.target.value;
            });

            textarea.addEventListener('focus', () => selectElement(el.id));

            container.appendChild(handle);
            container.appendChild(textarea);

            // Add Corner Resize Handle

            setupDraggable(container, handle, el);

        function createShapeDOM(el) {
            const isSelected = selectedElementId === el.id;

            const container = document.createElement('div');
            container.id = `dom_${el.id}`;
            container.className = `pdf-interactive-element cursor-move ${isSelected ? 'ring-2 ring-violet-500' : 'hover:ring-1 hover:ring-violet-300'}`;
            container.style.left = `${el.x * scale}px`;
            container.style.top = `${el.y * scale}px`;
            container.style.width = `${el.width * scale}px`;
            container.style.height = `${el.height * scale}px`;

            // Fixed hit-testing and pointer event handling for all shape types
            container.style.backgroundColor = el.shapeType === 'redact' ? '#ffffff' : 'rgba(255, 255, 255, 0.001)';
            container.style.pointerEvents = 'auto';

            if (el.shapeType === 'rectangle') {
                container.style.backgroundColor = el.fillEnabled ? (el.fillColor || '#8b5cf6') : 'rgba(255, 255, 255, 0.001)';
                container.style.border = `${el.strokeWidth || 3}px solid ${el.color}`;
            } else if (el.shapeType === 'circle') {
                container.style.backgroundColor = el.fillEnabled ? (el.fillColor || '#8b5cf6') : 'rgba(255, 255, 255, 0.001)';
                container.style.border = `${el.strokeWidth || 3}px solid ${el.color}`;
                container.style.borderRadius = '50%';
            } else if (el.shapeType === 'redact') {
                container.style.border = '1px solid #cbd5e1';
            } else if (el.shapeType === 'line' || el.shapeType === 'arrow') {
                // Expanded hit target height for line/arrow selection
                container.style.height = `${Math.max(30, (el.strokeWidth || 3) + 20)}px`;

                const lineVisual = document.createElement('div');
                lineVisual.className = 'w-full relative pointer-events-none';
                lineVisual.style.height = `${el.strokeWidth || 3}px`;
                lineVisual.style.backgroundColor = el.color;
                lineVisual.style.top = '50%';
                lineVisual.style.transform = 'translateY(-50%)';

                if (el.shapeType === 'arrow') {
                    const arrowhead = document.createElement('div');
                    arrowhead.style.position = 'absolute';
                    arrowhead.style.right = '0';
                    arrowhead.style.top = '50%';
                    arrowhead.style.transform = 'translate(50%, -50%)';
                    arrowhead.style.width = '0';
                    arrowhead.style.height = '0';
                    arrowhead.style.borderTop = '6px solid transparent';
                    arrowhead.style.borderBottom = '6px solid transparent';
                    arrowhead.style.borderLeft = `10px solid ${el.color}`;
                    lineVisual.appendChild(arrowhead);
                }

                container.appendChild(lineVisual);
            }

            container.addEventListener('mousedown', (e) => {
                e.stopPropagation();
                selectElement(el.id);
            });

            if (isSelected) {
                container.appendChild(createResizeHandles(el));
            }

            setupDraggable(container, container, el);
