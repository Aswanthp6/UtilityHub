<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PDF Editor - UtilityHub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b12;
            color: #ffffff;
        }

        header {
            height: 70px;
            display: flex;
            align-items: center;
            padding: 0 30px;
            border-bottom: 1px solid #242432;
            background: #101018;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            text-decoration: none;
            color: white;
        }

        .logo span {
            color: #8b5cf6;
        }

        .back {
            margin-left: auto;
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: white;
        }

        main {
            max-width: 1200px;
            margin: auto;
            padding: 40px 20px;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h1 {
            font-size: 36px;
            margin: 0 0 10px;
        }

        .title p {
            color: #999;
            margin: 0;
        }

        .upload-box {
            border: 2px dashed #38384a;
            border-radius: 18px;
            padding: 55px 20px;
            text-align: center;
            background: #11111a;
            transition: 0.2s;
            cursor: pointer;
        }

        .upload-box:hover {
            border-color: #8b5cf6;
            background: #14131f;
        }

        .upload-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .upload-box h2 {
            margin: 0 0 8px;
            font-size: 22px;
        }

        .upload-box p {
            color: #888;
            margin-bottom: 20px;
        }

        .upload-button {
            display: inline-block;
            background: #8b5cf6;
            padding: 12px 22px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        #pdfInput {
            display: none;
        }

        .editor {
            display: none;
            margin-top: 30px;
            background: #11111a;
            border: 1px solid #272737;
            border-radius: 16px;
            overflow: hidden;
        }

        .toolbar {
            min-height: 65px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 15px;
            border-bottom: 1px solid #292939;
            background: #151520;
            flex-wrap: wrap;
        }

        button {
            border: 1px solid #343448;
            background: #20202d;
            color: white;
            padding: 9px 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #2b2b3d;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .page-info {
            margin-left: auto;
            color: #aaa;
            font-size: 14px;
        }

        .viewer {
            min-height: 650px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 35px;
            overflow: auto;
            background: #09090e;
        }

        .canvas-container {
            background: white;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        #pdfCanvas {
            display: block;
            max-width: 100%;
        }

        .bottom-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 15px;
            border-top: 1px solid #292939;
            background: #151520;
        }

        .download {
            background: #8b5cf6;
            border-color: #8b5cf6;
            font-weight: 600;
        }

        .download:hover {
            background: #7c4fe0;
        }

        .status {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-top: 15px;
        }

        @media (max-width: 700px) {
            header {
                padding: 0 15px;
            }

            main {
                padding: 25px 12px;
            }

            .title h1 {
                font-size: 28px;
            }

            .viewer {
                padding: 15px;
                min-height: 500px;
            }

            .page-info {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="../index.html" class="logo">
        Utility<span>Hub</span>
    </a>

    <a href="../index.html" class="back">
        ← Back to Tools
    </a>
</header>

<main>

    <div class="title">
        <h1>PDF Editor</h1>
        <p>View, annotate and edit your PDF files directly in your browser.</p>
    </div>

    <!-- Upload -->
    <div class="upload-box" id="uploadBox">

        <div class="upload-icon">📄</div>

        <h2>Upload your PDF</h2>

        <p>
            Your PDF stays on your device.
        </p>

        <label class="upload-button" for="pdfInput">
            Choose PDF
        </label>

        <input
            type="file"
            id="pdfInput"
            accept="application/pdf"
        >

    </div>

    <!-- Editor -->
    <div class="editor" id="editor">

        <div class="toolbar">

            <button id="prevBtn">
                ← Previous
            </button>

            <button id="nextBtn">
                Next →
            </button>

            <button id="zoomOut">
                −
            </button>

            <button id="zoomIn">
                +
            </button>

            <button id="resetZoom">
                Reset Zoom
            </button>

            <span class="page-info" id="pageInfo">
                Page 1 / 1
            </span>

        </div>

        <div class="viewer">

            <div class="canvas-container">
                <canvas id="pdfCanvas"></canvas>
            </div>

        </div>

        <div class="bottom-bar">

            <button class="download" id="downloadBtn">
                ⬇ Download PDF
            </button>

        </div>

    </div>

    <div class="status" id="status"></div>

</main>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs"
        type="module"></script>

<script type="module">

    import * as pdfjsLib
        from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";


    const pdfInput = document.getElementById("pdfInput");
    const uploadBox = document.getElementById("uploadBox");
    const editor = document.getElementById("editor");

    const canvas = document.getElementById("pdfCanvas");
    const ctx = canvas.getContext("2d");

    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    const zoomIn = document.getElementById("zoomIn");
    const zoomOut = document.getElementById("zoomOut");
    const resetZoom = document.getElementById("resetZoom");

    const pageInfo = document.getElementById("pageInfo");
    const status = document.getElementById("status");

    let pdfDoc = null;
    let currentPage = 1;
    let scale = 1.3;


    // Click upload area
    uploadBox.addEventListener("click", function(e) {

        if (e.target.tagName !== "LABEL") {
            pdfInput.click();
        }

    });


    // File selected
    pdfInput.addEventListener("change", async function() {

        const file = pdfInput.files[0];

        if (!file) return;

        if (file.type !== "application/pdf") {

            status.textContent = "Please select a PDF file.";

            return;
        }

        status.textContent = "Loading PDF...";

        try {

            const arrayBuffer = await file.arrayBuffer();

            pdfDoc = await pdfjsLib.getDocument({
                data: arrayBuffer
            }).promise;

            currentPage = 1;

            uploadBox.style.display = "none";
            editor.style.display = "block";

            status.textContent =
                `${pdfDoc.numPages} page${pdfDoc.numPages > 1 ? "s" : ""} loaded.`;

            renderPage(currentPage);

        } catch (error) {

            console.error(error);

            status.textContent =
                "Could not open this PDF.";

        }

    });


    // Render page
    async function renderPage(pageNumber) {

        if (!pdfDoc) return;

        const page = await pdfDoc.getPage(pageNumber);

        const viewport = page.getViewport({
            scale: scale
        });

        canvas.width = viewport.width;
        canvas.height = viewport.height;

        await page.render({
            canvasContext: ctx,
            viewport: viewport
        }).promise;

        pageInfo.textContent =
            `Page ${currentPage} / ${pdfDoc.numPages}`;

        prevBtn.disabled = currentPage <= 1;
        nextBtn.disabled = currentPage >= pdfDoc.numPages;

    }


    // Previous page
    prevBtn.addEventListener("click", function() {

        if (currentPage <= 1) return;

        currentPage--;

        renderPage(currentPage);

    });


    // Next page
    nextBtn.addEventListener("click", function() {

        if (currentPage >= pdfDoc.numPages) return;

        currentPage++;

        renderPage(currentPage);

    });


    // Zoom in
    zoomIn.addEventListener("click", function() {

        scale += 0.2;

        renderPage(currentPage);

    });


    // Zoom out
    zoomOut.addEventListener("click", function() {

        if (scale <= 0.6) return;

        scale -= 0.2;

        renderPage(currentPage);

    });


    // Reset zoom
    resetZoom.addEventListener("click", function() {

        scale = 1.3;

        renderPage(currentPage);

    });


    // Download placeholder
    document.getElementById("downloadBtn")
        .addEventListener("click", function() {

            alert(
                "PDF editing and export will be added in the next steps."
            );

        });

</script>

</body>
</html>
