        function createImageDOM(el) {
            const isSelected = selectedElementId === el.id;

            const container = document.createElement('div');
            container.id = `dom_${el.id}`;
            container.className = `pdf-interactive-element cursor-move ${isSelected ? 'ring-2 ring-violet-500' : 'hover:ring-1 hover:ring-violet-300'}`;
            container.style.left = `${el.x * scale}px`;
            container.style.top = `${el.y * scale}px`;
            container.style.width = `${el.width * scale}px`;
            container.style.height = `${el.height * scale}px`;

            const img = document.createElement('img');
            img.src = el.dataUrl;
            img.className = 'w-full h-full object-contain pointer-events-none';

            container.appendChild(img);
            container.addEventListener('mousedown', (e) => {
                e.stopPropagation();
                selectElement(el.id);
            });

            if (isSelected) {
                container.appendChild(createResizeHandles(el));
            }

            setupDraggable(container, container, el);
            return container;
        }

        function createResizeHandles(elementData) {
            const fragment = document.createDocumentFragment();
            const corners = ['nw', 'ne', 'sw', 'se'];

            corners.forEach(corner => {
                const handle = document.createElement('div');
                handle.className = `resize-handle resize-handle-${corner}`;
                handle.dataset.corner = corner;

                handle.addEventListener('mousedown', (e) => {
                    e.stopPropagation();
                    e.preventDefault();

                    const startX = e.clientX;
                    const startY = e.clientY;
                    const origX = elementData.x;
                    const origY = elementData.y;
                    const origW = elementData.width;
                    const origH = elementData.height;
                    const minW = 30;
                    const minH = 20;

                    const onMouseMove = (me) => {
                        const dx = (me.clientX - startX) / scale;
                        const dy = (me.clientY - startY) / scale;

                        let newX = origX;
                        let newY = origY;
                        let newW = origW;
                        let newH = origH;

                        if (corner.includes('e')) {
                            newW = Math.max(minW, origW + dx);
                        }
                        if (corner.includes('s')) {
                            newH = Math.max(minH, origH + dy);
                        }
                        if (corner.includes('w')) {
                            newW = Math.max(minW, origW - dx);
                            newX = origX + (origW - newW);
                        }
                        if (corner.includes('n')) {
                            newH = Math.max(minH, origH - dy);
                            newY = origY + (origH - newH);
                        }

                        elementData.x = Math.max(0, newX);
                        elementData.y = Math.max(0, newY);
                        elementData.width = newW;
                        elementData.height = newH;

                        renderPageElements(currentPageNum);
                    };

                    const onMouseUp = () => {
                        document.removeEventListener('mousemove', onMouseMove);
                        document.removeEventListener('mouseup', onMouseUp);
                        saveState();
                    };

                    document.addEventListener('mousemove', onMouseMove);
                    document.addEventListener('mouseup', onMouseUp);
                });

                fragment.appendChild(handle);
            });

            return fragment;
        }

        function setupDraggable(container, handle, elementData) {
            let startX = 0, startY = 0, origX = 0, origY = 0;
            let isDragging = false;

            const onMouseDown = (e) => {
                if (e.target.tagName.toLowerCase() === 'textarea' || e.target.classList.contains('resize-handle')) return;

                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                origX = elementData.x;
                origY = elementData.y;

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            };

            const onMouseMove = (e) => {
                if (!isDragging) return;
                const dx = (e.clientX - startX) / scale;
                const dy = (e.clientY - startY) / scale;

                elementData.x = Math.max(0, origX + dx);
                elementData.y = Math.max(0, origY + dy);

                container.style.left = `${elementData.x * scale}px`;
                container.style.top = `${elementData.y * scale}px`;
            };

            const onMouseUp = () => {
                if (isDragging) {
                    isDragging = false;
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                    saveState();
                }
            };

            handle.addEventListener('mousedown', onMouseDown);
        }

        function setupDrawingEvents(canvas, pageNum) {
            const ctx = canvas.getContext('2d');

            const getPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const clientX = (e.touches && e.touches.length > 0) ? e.touches[0].clientX : e.clientX;
                const clientY = (e.touches && e.touches.length > 0) ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) / scale,
                    y: (clientY - rect.top) / scale
                };
            };

            const startDraw = (e) => {
                if (currentTool !== 'pen' && currentTool !== 'highlighter' && currentTool !== 'eraser') return;
                isDrawing = true;
                const pos = getPos(e);
                currentPath = [pos];
            };

            const draw = (e) => {
                if (!isDrawing) return;
                const pos = getPos(e);
                currentPath.push(pos);

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                redrawCanvasPaths(canvas, pageNum);

                // Draw live path stroke
                ctx.beginPath();
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                if (currentTool === 'pen') {
                    ctx.strokeStyle = primaryColor;
                    ctx.lineWidth = brushSize * scale;
                    ctx.globalAlpha = 1.0;
                } else if (currentTool === 'highlighter') {
                    ctx.strokeStyle = primaryColor;
                    ctx.lineWidth = brushSize * 6 * scale;
                    ctx.globalAlpha = highlightOpacity;
                } else if (currentTool === 'eraser') {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = Math.max(12, brushSize * 4) * scale;
                    ctx.globalCompositeOperation = 'destination-out';
                }

                ctx.moveTo(currentPath[0].x * scale, currentPath[0].y * scale);
                for (let i = 1; i < currentPath.length; i++) {
                    ctx.lineTo(currentPath[i].x * scale, currentPath[i].y * scale);
                }
                ctx.stroke();
                ctx.globalCompositeOperation = 'source-over';
            };

            const stopDraw = () => {
                if (!isDrawing) return;
                isDrawing = false;

                if (currentPath.length > 0) {
                    if (currentTool === 'eraser') {
                        const radius = Math.max(8, brushSize * 4);
                        const paths = pageDrawings[pageNum] || [];

                        if (eraserMode === 'partial') {
                            // Remove only the portion actually crossed by the eraser.
                            const updatedPaths = [];

                            for (const path of paths) {
                                if (!path.points || path.points.length < 2) {
                                    const touched = path.points && path.points.length === 1 &&
                                        currentPath.some(ep => Math.hypot(path.points[0].x - ep.x, path.points[0].y - ep.y) <= radius);
                                    if (!touched) updatedPaths.push(path);
                                    continue;
                                }

                                const pieces = splitPathByEraser(path, currentPath, radius);
                                updatedPaths.push(...pieces);
                            }

                            pageDrawings[pageNum] = updatedPaths;
                        } else {
                            // Whole-stroke modes use the same intersection test, but preserve
                            // the original stroke objects and remove complete strokes.
                            const touchedIndexes = [];
                            paths.forEach((path, index) => {
                                if (!path.points || path.points.length === 0) return;
                                const touched = path.points.some(a =>
                                    currentPath.some(b => Math.hypot(a.x - b.x, a.y - b.y) <= radius)
                                );
                                if (touched) touchedIndexes.push(index);
                            });

                            if (eraserMode === 'last') {
                                const removeIndex = touchedIndexes.length ? touchedIndexes[touchedIndexes.length - 1] : -1;
                                pageDrawings[pageNum] = paths.filter((_, index) => index !== removeIndex);
                            } else {
                                // Erase whole stroke: every stroke touched by the eraser is removed.
                                pageDrawings[pageNum] = paths.filter((_, index) => !touchedIndexes.includes(index));
                            }
                        }
                    } else {
                        if (!pageDrawings[pageNum]) pageDrawings[pageNum] = [];
                        pageDrawings[pageNum].push({
                            tool: currentTool,
                            color: primaryColor,
                            width: brushSize,
                            opacity: currentTool === 'highlighter' ? highlightOpacity : 1,
                            points: currentPath
                        });
                    }
                    saveState();
                    redrawCanvasPaths(canvas, pageNum);
                }
                currentPath = [];
            };

            // Mouse events
            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDraw);
            canvas.addEventListener('mouseleave', stopDraw);

            // Touch events for mobile/tablet
            canvas.addEventListener('touchstart', (e) => { startDraw(e); e.preventDefault(); }, { passive: false });
            canvas.addEventListener('touchmove', (e) => { draw(e); e.preventDefault(); }, { passive: false });
            canvas.addEventListener('touchend', (e) => { stopDraw(); e.preventDefault(); }, { passive: false });
        }

        function distancePointToSegment(p, a, b) {
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            if (dx === 0 && dy === 0) return Math.hypot(p.x - a.x, p.y - a.y);

            const t = Math.max(0, Math.min(1,
                ((p.x - a.x) * dx + (p.y - a.y) * dy) / (dx * dx + dy * dy)
            ));
            const projection = {
                x: a.x + t * dx,
                y: a.y + t * dy
            };
            return Math.hypot(p.x - projection.x, p.y - projection.y);
        }

        function orientation(a, b, c) {
            const value = (b.y - a.y) * (c.x - b.x) -
                (b.x - a.x) * (c.y - b.y);
            if (Math.abs(value) < 1e-9) return 0;
            return value > 0 ? 1 : 2;
        }

        function onSegment(a, b, c) {
            return b.x <= Math.max(a.x, c.x) + 1e-9 &&
                b.x >= Math.min(a.x, c.x) - 1e-9 &&
                b.y <= Math.max(a.y, c.y) + 1e-9 &&
                b.y >= Math.min(a.y, c.y) - 1e-9;
        }

        function segmentsIntersect(a, b, c, d) {
            const o1 = orientation(a, b, c);
            const o2 = orientation(a, b, d);
            const o3 = orientation(c, d, a);
            const o4 = orientation(c, d, b);

            if (o1 !== o2 && o3 !== o4) return true;
            if (o1 === 0 && onSegment(a, c, b)) return true;
            if (o2 === 0 && onSegment(a, d, b)) return true;
            if (o3 === 0 && onSegment(c, a, d)) return true;
            if (o4 === 0 && onSegment(c, b, d)) return true;
            return false;
        }

        function distanceBetweenSegments(a, b, c, d) {
            if (segmentsIntersect(a, b, c, d)) return 0;
            return Math.min(
                distancePointToSegment(a, c, d),
                distancePointToSegment(b, c, d),
                distancePointToSegment(c, a, b),
                distancePointToSegment(d, a, b)
            );
        }

        function splitPathByEraser(path, eraserPoints, radius) {
            const points = path.points || [];
            const pieces = [];
            let current = [];

            for (let i = 0; i < points.length - 1; i++) {
                const a = points[i];
                const b = points[i + 1];
                let touched = false;

                for (let j = 0; j < eraserPoints.length - 1; j++) {
                    const ea = eraserPoints[j];
                    const eb = eraserPoints[j + 1];
                    if (distanceBetweenSegments(a, b, ea, eb) <= radius) {
                        touched = true;
                        break;
                    }
                }

                if (touched) {
                    if (current.length >= 2) {
                        pieces.push({ ...path, points: current });
                    }
                    current = [];
                } else {
                    if (current.length === 0) current.push(a);
                    current.push(b);
                }
            }

            if (current.length >= 2) {
                pieces.push({ ...path, points: current });
            }

            return pieces;
        }

        function redrawCanvasPaths(canvas, pageNum) {
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const paths = pageDrawings[pageNum] || [];
            paths.forEach(p => {
                ctx.beginPath();
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                if (p.tool === 'pen') {
                    ctx.strokeStyle = p.color;
                    ctx.lineWidth = (p.width || 3) * scale;
                    ctx.globalAlpha = p.opacity ?? 1;
                } else if (p.tool === 'highlighter') {
                    ctx.strokeStyle = p.color;
                    ctx.lineWidth = (p.width || 3) * 6 * scale;
                    ctx.globalAlpha = p.opacity ?? 0.35;
                } else if (p.tool === 'eraser') {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = Math.max(12, brushSize * 4) * scale;
                    ctx.globalCompositeOperation = 'destination-out';
                }

                ctx.moveTo(p.points[0].x * scale, p.points[0].y * scale);
                for (let i = 1; i < p.points.length; i++) {
                    ctx.lineTo(p.points[i].x * scale, p.points[i].y * scale);
                }
                ctx.stroke();
                ctx.globalCompositeOperation = 'source-over';
            });
        }

        function saveState() {
            if (historyStep < historyStack.length - 1) {
                historyStack = historyStack.slice(0, historyStep + 1);
            }

            historyStack.push({
                elements: JSON.parse(JSON.stringify(pageElements)),
                drawings: JSON.parse(JSON.stringify(pageDrawings))
            });
            historyStep++;
        }

        function undo() {
            if (historyStep > 0) {
                historyStep--;
                restoreState(historyStack[historyStep]);
            }
        }

        function redo() {
            if (historyStep < historyStack.length - 1) {
                historyStep++;
                restoreState(historyStack[historyStep]);
            }
        }

        function restoreState(state) {
            pageElements = JSON.parse(JSON.stringify(state.elements));
            pageDrawings = JSON.parse(JSON.stringify(state.drawings));
            renderPage(currentPageNum);
        }

        function selectElement(id) {
            if (selectedElementId === id) return;

            const oldId = selectedElementId;
            selectedElementId = id;

            // Remove highlight/resize handle from previously selected DOM element
            if (oldId) {
                const oldDom = document.getElementById(`dom_${oldId}`);
                if (oldDom) {
                    oldDom.classList.remove('ring-2', 'ring-violet-500', 'bg-violet-50/10');
                    oldDom.classList.add('hover:ring-1', 'hover:ring-violet-300');
                    const oldHandle = oldDom.querySelector('.resize-handle');
                    if (oldHandle) oldHandle.remove();
                    const oldHeader = oldDom.querySelector('.drag-handle');
                    if (oldHeader) {
                        oldHeader.classList.add('hidden');
                        oldHeader.classList.remove('flex');
                    }
                }
            }

            // Add highlight/resize handle to newly selected DOM element without destroying DOM
            if (id) {
                const newDom = document.getElementById(`dom_${id}`);
                if (newDom) {
                    newDom.classList.add('ring-2', 'ring-violet-500');
                    newDom.classList.remove('hover:ring-1', 'hover:ring-violet-300');
                    if (newDom.querySelector('textarea')) {
                        newDom.classList.add('bg-violet-50/10');
                    }
                    const header = newDom.querySelector('.drag-handle');
                    if (header) {
                        header.classList.remove('hidden');
                        header.classList.add('flex');
                    }

                    if (!newDom.querySelector('.resize-handle')) {
                        const elements = pageElements[currentPageNum] || [];
                        const el = elements.find(item => item.id === id);
                        if (el) {
                            newDom.appendChild(createResizeHandles(el));
                        }
                    }
                }

                // Sync property controls with selected element
                const elements = pageElements[currentPageNum] || [];
                const el = elements.find(item => item.id === id);
                if (el) {
                    if (el.color) document.getElementById('primary-color').value = el.color;
                    if (el.fontSize) document.getElementById('font-size').value = el.fontSize;
                    if (el.fontFamily) document.getElementById('font-family').value = el.fontFamily;
                    if (el.type === 'text') syncTextFormatFromElement(el);
                    if (el.strokeWidth) {
                        document.getElementById('stroke-width').value = el.strokeWidth;
                        document.getElementById('stroke-width-value').textContent = el.strokeWidth;
                        strokeWidth = el.strokeWidth;
                    }
                    if (el.type === 'shape') {
                        shapeFillColor = el.fillColor || '#8b5cf6';
                        shapeFillEnabled = !!el.fillEnabled;
                        document.getElementById('shape-fill-color').value = shapeFillColor;
                        document.getElementById('shape-fill-enabled').checked = shapeFillEnabled;
                    }
                    const shapeFillControl = document.getElementById('shape-fill-control');
                    if (shapeFillControl) {
                        const showShapeFill = el.type === 'shape';
                        shapeFillControl.classList.toggle('hidden', !showShapeFill);
                        shapeFillControl.classList.toggle('flex', showShapeFill);
                    }
                    syncShapeFillUI();
                }
            }
        }

        function deselectAllElements() {
            if (selectedElementId !== null) {
                const oldId = selectedElementId;
                selectedElementId = null;
                if (oldId) {
                    const oldDom = document.getElementById(`dom_${oldId}`);
                    if (oldDom) {
                        oldDom.classList.remove('ring-2', 'ring-violet-500', 'bg-violet-50/10');
                        oldDom.classList.add('hover:ring-1', 'hover:ring-violet-300');
                        const oldHandle = oldDom.querySelector('.resize-handle');
                        if (oldHandle) oldHandle.remove();
                        const oldHeader = oldDom.querySelector('.drag-handle');
                        if (oldHeader) {
                            oldHeader.classList.add('hidden');
                            oldHeader.classList.remove('flex');
                        }
                    }
                }
            }
        }

        function clearCurrentPageMarkings() {
            const hadElements = (pageElements[currentPageNum] || []).length > 0;
            const hadDrawings = (pageDrawings[currentPageNum] || []).length > 0;
            if (!hadElements && !hadDrawings) return;
            if (!confirm('Clear all annotations and drawings from the current page?')) return;
            pageElements[currentPageNum] = [];
            pageDrawings[currentPageNum] = [];
            selectedElementId = null;
            saveState();
            renderPage(currentPageNum);
        }

        function deleteElementById(id) {
            if (pageElements[currentPageNum]) {
                pageElements[currentPageNum] = pageElements[currentPageNum].filter(el => el.id !== id);
            }
            if (selectedElementId === id) selectedElementId = null;
            saveState();
            renderPageElements(currentPageNum);
        }

        function deleteSelectedElement() {
            if (selectedElementId) deleteElementById(selectedElementId);
        }

        async function renderSidebarThumbnails() {
            const container = document.getElementById('thumbnail-container');
            container.innerHTML = '';

            for (let i = 1; i <= totalPages; i++) {
                const page = await pdfDoc.getPage(i);
                const vp = page.getViewport({ scale: 0.2 });

                const thumbBox = document.createElement('div');
                thumbBox.className = `p-1 bg-slate-900 rounded border cursor-pointer hover:border-violet-500 transition ${i === currentPageNum ? 'border-blue-500 ring-1 ring-violet-500' : 'border-slate-700'}`;

                const canvas = document.createElement('canvas');
                canvas.width = vp.width;
                canvas.height = vp.height;
                canvas.className = 'w-full h-auto rounded';

                await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;

                thumbBox.appendChild(canvas);
                thumbBox.addEventListener('click', () => {
                    currentPageNum = i;
                    renderPage(currentPageNum);
                });

                container.appendChild(thumbBox);
            }
        }

        function setupSignaturePad() {
            const modal = document.getElementById('signature-modal');
            const pad = document.getElementById('signature-pad');
            const ctx = pad.getContext('2d');
            let drawing = false;

            document.getElementById('btn-signature-modal').addEventListener('click', () => {
                modal.classList.remove('hidden');
                ctx.clearRect(0, 0, pad.width, pad.height);
            });

            document.getElementById('btn-close-sig-modal').addEventListener('click', () => {
                modal.classList.add('hidden');
            });

            document.getElementById('btn-clear-sig').addEventListener('click', () => {
                ctx.clearRect(0, 0, pad.width, pad.height);
            });

            pad.addEventListener('mousedown', () => { drawing = true; ctx.beginPath(); });
            pad.addEventListener('mouseup', () => drawing = false);
            pad.addEventListener('mousemove', (e) => {
                if (!drawing) return;
                const rect = pad.getBoundingClientRect();
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.strokeStyle = '#000000';
                ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
                ctx.stroke();
            });

            document.getElementById('btn-save-sig').addEventListener('click', () => {
                const dataUrl = pad.toDataURL('image/png');
                modal.classList.add('hidden');

                const newEl = {
                    id: 'el_' + Date.now(),
                    type: 'signature',
                    dataUrl: dataUrl,
                    x: 100,
                    y: 100,
                    width: 160,
                    height: 64
                };

                if (!pageElements[currentPageNum]) pageElements[currentPageNum] = [];
                pageElements[currentPageNum].push(newEl);

                saveState();
                renderPageElements(currentPageNum);
            });
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (evt) => {
                const newEl = {
                    id: 'el_' + Date.now(),
                    type: 'image',
                    dataUrl: evt.target.result,
                    x: 100,
                    y: 100,
                    width: 180,
                    height: 120
                };

                if (!pageElements[currentPageNum]) pageElements[currentPageNum] = [];
                pageElements[currentPageNum].push(newEl);

                saveState();
                renderPageElements(currentPageNum);
            };
            reader.readAsDataURL(file);
        }

        async function exportPDF() {
            try {
                let pdfDocLib;
                if (originalPdfBytes) {
                    pdfDocLib = await PDFLib.PDFDocument.load(originalPdfBytes);
                } else {
                    pdfDocLib = await PDFLib.PDFDocument.create();
                }

                const pages = pdfDocLib.getPages();
                const hexToRgb = (hex) => {
                    hex = (hex || '#2563eb').replace('#', '');
                    if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
                    return PDFLib.rgb(
                        parseInt(hex.slice(0, 2), 16) / 255,
                        parseInt(hex.slice(2, 4), 16) / 255,
                        parseInt(hex.slice(4, 6), 16) / 255
                    );
                };

                const fontMap = {
                    'sans-serif': { normal: PDFLib.StandardFonts.Helvetica, bold: PDFLib.StandardFonts.HelveticaBold, italic: PDFLib.StandardFonts.HelveticaOblique, boldItalic: PDFLib.StandardFonts.HelveticaBoldOblique },
                    'serif': { normal: PDFLib.StandardFonts.TimesRoman, bold: PDFLib.StandardFonts.TimesRomanBold, italic: PDFLib.StandardFonts.TimesRomanItalic, boldItalic: PDFLib.StandardFonts.TimesRomanBoldItalic },
                    'monospace': { normal: PDFLib.StandardFonts.Courier, bold: PDFLib.StandardFonts.CourierBold, italic: PDFLib.StandardFonts.CourierOblique, boldItalic: PDFLib.StandardFonts.CourierBoldOblique }
                };

                for (let pageIdx = 0; pageIdx < pages.length; pageIdx++) {
                    const pageNum = pageIdx + 1;
                    const page = pages[pageIdx];
                    const { width, height } = page.getSize();

                    // Interactive elements
                    const elements = pageElements[pageNum] || [];
                    for (const el of elements) {
                        const color = hexToRgb(el.color);

                        if (el.type === 'text') {
                            const text = el.text || '';
                            const size = el.fontSize || 16;
                            const family = fontMap[el.fontFamily] || fontMap['sans-serif'];
                            const fontKey = el.fontBold && el.fontItalic ? 'boldItalic' : (el.fontBold ? 'bold' : (el.fontItalic ? 'italic' : 'normal'));
                            const font = await pdfDocLib.embedFont(family[fontKey]);
                            const lines = text.split(/\r?\n/);
                            const lineHeight = size * 1.2;
                            lines.forEach((line, i) => {
                                const lineWidth = font.widthOfTextAtSize(line, size);
                                let drawX = el.x;
                                const align = el.textAlign || 'left';
                                if (align === 'center') drawX = el.x + Math.max(0, (el.width - lineWidth) / 2);
                                else if (align === 'right') drawX = el.x + Math.max(0, el.width - lineWidth);

                                const drawY = height - el.y - size - (i * lineHeight);
                                page.drawText(line, { x: drawX, y: drawY, size, font, color });

                                if (el.fontUnderline && line.length) {
                                    const underlineY = drawY - Math.max(1, size * 0.08);
                                    page.drawLine({
                                        start: { x: drawX, y: underlineY },
                                        end: { x: drawX + lineWidth, y: underlineY },
                                        thickness: Math.max(0.8, size * 0.06),
                                        color
                                    });
                                }
                            });

                        } else if (el.type === 'shape') {
                            const stroke = el.strokeWidth || 3;
                            const pdfY = height - el.y - el.height;

                            if (el.shapeType === 'redact') {
                                page.drawRectangle({
                                    x: el.x, y: pdfY,
                                    width: el.width, height: el.height,
                                    color: PDFLib.rgb(1, 1, 1)
                                });
                            } else if (el.shapeType === 'rectangle') {
                                const fillColor = el.fillEnabled ? hexToRgb(el.fillColor || '#8b5cf6') : undefined;
                                const options = {
                                    x: el.x, y: pdfY,
                                    width: el.width, height: el.height,
                                    borderColor: color, borderWidth: stroke
                                };
                                if (fillColor) options.color = fillColor;
                                page.drawRectangle(options);
                            } else if (el.shapeType === 'circle') {
                                const fillColor = el.fillEnabled ? hexToRgb(el.fillColor || '#8b5cf6') : undefined;
                                const options = {
                                    x: el.x + el.width / 2,
                                    y: pdfY + el.height / 2,
                                    xScale: el.width / 2,
                                    yScale: el.height / 2,
                                    borderColor: color,
                                    borderWidth: stroke
                                };
                                if (fillColor) options.color = fillColor;
                                page.drawEllipse(options);
                            } else if (el.shapeType === 'line' || el.shapeType === 'arrow') {
                                const start = { x: el.x, y: height - el.y - el.height / 2 };
                                const end = { x: el.x + el.width, y: height - el.y - el.height / 2 };
                                page.drawLine({
                                    start, end,
                                    thickness: stroke,
                                    color
                                });
                                if (el.shapeType === 'arrow') {
                                    const angle = Math.atan2(end.y - start.y, end.x - start.x);
                                    const len = Math.max(8, stroke * 3);
                                    const wing = Math.PI / 6;
                                    page.drawLine({
                                        start: end,
                                        end: {
                                            x: end.x - len * Math.cos(angle - wing),
                                            y: end.y - len * Math.sin(angle - wing)
                                        },
                                        thickness: stroke,
                                        color
                                    });
                                    page.drawLine({
                                        start: end,
                                        end: {
                                            x: end.x - len * Math.cos(angle + wing),
                                            y: end.y - len * Math.sin(angle + wing)
                                        },
                                        thickness: stroke,
                                        color
                                    });
                                }
                            }

                        } else if (el.type === 'image' || el.type === 'signature') {
                            const img = await pdfDocLib.embedPng(el.dataUrl);
                            page.drawImage(img, {
                                x: el.x,
                                y: height - el.y - el.height,
                                width: el.width,
                                height: el.height
                            });
                        }
                    }

                    // Freehand annotations
                    const paths = pageDrawings[pageNum] || [];
                    for (const path of paths) {
                        if (!path.points || path.points.length < 2) continue;

                        const color = hexToRgb(path.color);
                        const thickness = path.width || 3;
                        const opacity = path.opacity ?? (path.tool === 'highlighter' ? 0.35 : 1);

                        for (let i = 1; i < path.points.length; i++) {
                            const a = path.points[i - 1];
                            const b = path.points[i];
                            page.drawLine({
                                start: { x: a.x, y: height - a.y },
                                end: { x: b.x, y: height - b.y },
                                thickness: path.tool === 'highlighter' ? thickness * 6 : thickness,
                                color,
                                opacity
                            });
                        }
                    }
                }

                const pdfBytes = await pdfDocLib.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'edited_document.pdf';
                document.body.appendChild(link);
                link.click();
                link.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            } catch (err) {
                console.error("Export PDF failed: ", err);
                alert("Could not export the PDF. Please check the browser console for details.");
            }
        }
    </script>
