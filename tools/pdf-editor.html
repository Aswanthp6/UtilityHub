<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PDF Editor - UtilityHub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b12;
            color: white;
        }

        header {
            height: 70px;
            display: flex;
            align-items: center;
            padding: 0 30px;
            border-bottom: 1px solid #242432;
            background: #101018;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            text-decoration: none;
            color: white;
        }

        .logo span {
            color: #8b5cf6;
        }

        .back {
            margin-left: auto;
            color: #aaa;
            text-decoration: none;
        }

        .back:hover {
            color: white;
        }

        main {
            max-width: 1200px;
            margin: auto;
            padding: 40px 20px;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h1 {
            margin: 0 0 10px;
            font-size: 36px;
        }

        .title p {
            color: #999;
        }

        .upload-box {
            border: 2px dashed #38384a;
            border-radius: 18px;
            padding: 55px 20px;
            text-align: center;
            background: #11111a;
            cursor: pointer;
        }

        .upload-box:hover {
            border-color: #8b5cf6;
        }

        .upload-icon {
            font-size: 50px;
        }

        .upload-box h2 {
            margin-bottom: 8px;
        }

        .upload-box p {
            color: #888;
        }

        .upload-button {
            display: inline-block;
            background: #8b5cf6;
            padding: 12px 22px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        #pdfInput {
            display: none;
        }

        .editor {
            display: none;
            margin-top: 30px;
            background: #11111a;
            border: 1px solid #272737;
            border-radius: 16px;
            overflow: hidden;
        }

        .toolbar {
            min-height: 65px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 15px;
            border-bottom: 1px solid #292939;
            background: #151520;
            flex-wrap: wrap;
        }

        button {
            border: 1px solid #343448;
            background: #20202d;
            color: white;
            padding: 9px 13px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #2b2b3d;
        }

        button.active {
            background: #8b5cf6;
            border-color: #8b5cf6;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .separator {
            width: 1px;
            height: 30px;
            background: #383849;
            margin: 0 4px;
        }

        .page-info {
            margin-left: auto;
            color: #aaa;
            font-size: 14px;
        }

        .viewer {
            min-height: 650px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 35px;
            overflow: auto;
            background: #09090e;
        }

        .page-wrapper {
            position: relative;
            background: white;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        #shapeType {
            padding: 9px 10px;
            border: 1px solid #343448;
            border-radius: 8px;
            background: #20202d;
            color: white;
            cursor: pointer;
        }

        #shapeType:focus {
            outline: none;
            border-color: #8b5cf6;
        }

        #shapeType:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .drawing-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px 0;
        }

        .drawing-controls label {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #aaa;
            font-size: 12px;
        }

        .drawing-controls input[type="color"] {
            width: 30px;
            height: 28px;
            padding: 2px;
            border: 1px solid #343448;
            border-radius: 6px;
            background: #20202d;
            cursor: pointer;
        }

        .drawing-controls input[type="range"] {
            width: 70px;
        }

        .control-value {
            min-width: 34px;
            color: #ddd;
        }

        @media (max-width: 900px) {
            .toolbar {
                flex-wrap: wrap;
            }

            .drawing-controls {
                width: 100%;
                flex-wrap: wrap;
            }
        }

        #pdfCanvas {
            display: block;
        }

        #textLayer {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: auto;
        }

        #drawingLayer {
            position: absolute;
            inset: 0;
            cursor: crosshair;
            touch-action: none;
            pointer-events: none;
        }

        .drawing-active {
            cursor: crosshair;
        }

        .text-item {
            position: absolute;
            color: #111;
            cursor: move;
            white-space: nowrap;
            user-select: none;
            padding: 2px 4px;
            border: 1px dashed transparent;
        }

        .text-item:hover {
            border-color: #8b5cf6;
        }

        .text-item.selected {
            border: 1px dashed #8b5cf6;
            background: rgba(139, 92, 246, 0.08);
        }

        .text-item .delete-text {
            display: none;
            position: absolute;
            top: -22px;
            right: -1px;
            padding: 2px 7px;
            border-radius: 5px;
            background: #ef4444;
            color: white;
            font-size: 12px;
            cursor: pointer;
        }

        .text-item.selected .delete-text {
            display: block;
        }

        .bottom-bar {
            display: flex;
            justify-content: center;
            padding: 15px;
            border-top: 1px solid #292939;
            background: #151520;
        }

        .download {
            background: #8b5cf6;
            border-color: #8b5cf6;
            font-weight: 600;
        }

        .status {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-top: 15px;
        }

        .text-controls {
            display: none;
            align-items: center;
            gap: 7px;
        }

        .text-controls input {
            width: 65px;
            padding: 7px;
            border: 1px solid #343448;
            border-radius: 7px;
            background: #20202d;
            color: white;
        }

        .text-dialog {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.65);
            padding: 20px;
        }

        .text-dialog.show {
            display: flex;
        }

        .text-dialog-box {
            width: min(420px, 100%);
            background: #151520;
            border: 1px solid #343448;
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .text-dialog-box h3 {
            margin: 0 0 15px;
        }

        #textInput {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #343448;
            border-radius: 8px;
            background: #20202d;
            color: white;
            outline: none;
            font-size: 16px;
        }

        #textInput:focus {
            border-color: #8b5cf6;
        }

        .text-dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 15px;
        }

        .dialog-primary {
            background: #8b5cf6;
            border-color: #8b5cf6;
        }

        @media (max-width: 700px) {

            header {
                padding: 0 15px;
            }

            main {
                padding: 25px 12px;
            }

            .title h1 {
                font-size: 28px;
            }

            .viewer {
                padding: 15px;
                min-height: 500px;
            }

            .page-info {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>

    <header>

        <a href="../index.html" class="logo">
            Utility<span>Hub</span>
        </a>

        <a href="../index.html" class="back">
            ← Back to Tools
        </a>

    </header>

    <main>

        <div class="title">

            <h1>PDF Editor</h1>

            <p>
                View, annotate and edit your PDF files directly in your browser.
            </p>

        </div>


        <!-- Upload -->

        <div class="upload-box" id="uploadBox">

            <div class="upload-icon">📄</div>

            <h2>Upload your PDF</h2>

            <p>
                Your PDF stays on your device.
            </p>

            <label class="upload-button" for="pdfInput">
                Choose PDF
            </label>

            <input type="file" id="pdfInput" accept="application/pdf">

        </div>


        <!-- Editor -->

        <div class="editor" id="editor">

            <div class="toolbar">

                <button id="prevBtn">
                    ← Previous
                </button>

                <button id="nextBtn">
                    Next →
                </button>

                <div class="separator"></div>

                <button id="zoomOut">
                    −
                </button>

                <button id="zoomIn">
                    +
                </button>

                <button id="resetZoom">
                    Reset
                </button>

                <div class="separator"></div>

                <button id="addTextBtn">
                    ✏️ Add Text
                </button>
                <button id="drawBtn">
                    🖊️ Draw
                </button>

                <button id="highlightBtn">
                    🖍️ Highlight
                </button>

                <button id="clearDrawingsBtn">
                    🗑️ Clear Markings
                </button>

                <button id="shapeBtn">
                    ▢ Shapes
                </button>
                <select id="shapeType">
                    <option value="rectangle">Rectangle</option>
                    <option value="circle">Circle</option>
                    <option value="line">Line</option>
                    <option value="arrow">Arrow</option>
                </select>

                <div class="drawing-controls" id="drawingControls">
                    <label title="Draw and shape color">
                        Color
                        <input type="color" id="drawingColor" value="#111111">
                    </label>

                    <label title="Brush or shape border width">
                        Width
                        <input type="range" id="brushSize" min="1" max="20" value="3">
                        <span class="control-value" id="brushSizeValue">3</span>
                    </label>

                    <label title="Highlight color">
                        Highlight
                        <input type="color" id="highlightColor" value="#ffff00">
                    </label>

                    <label title="Highlight opacity">
                        Opacity
                        <input type="range" id="highlightOpacity" min="10" max="100" value="28">
                        <span class="control-value" id="highlightOpacityValue">28%</span>
                    </label>
                </div>

                <div class="text-controls" id="textControls">

                    <label>
                        Size
                        <input type="number" id="fontSize" value="18" min="8" max="100">
                    </label>

                </div>

                <span class="page-info" id="pageInfo">
                    Page 1 / 1
                </span>

            </div>


            <div class="viewer">

                <div class="page-wrapper" id="pageWrapper">

                    <canvas id="pdfCanvas"></canvas>

                    <div id="textLayer"></div>

                    <canvas id="drawingLayer"></canvas>

                </div>

            </div>


            <div class="bottom-bar">

                <button class="download" id="downloadBtn">
                    ⬇ Download PDF
                </button>

            </div>

        </div>


        <div class="text-dialog" id="textDialog">
            <div class="text-dialog-box">
                <h3>Add Text</h3>
                <input type="text" id="textInput" placeholder="Enter text..." autocomplete="off">
                <div class="text-dialog-actions">
                    <button id="cancelTextBtn">Cancel</button>
                    <button id="insertTextBtn" class="dialog-primary">Add Text</button>
                </div>
            </div>
        </div>

        <div class="status" id="status"></div>

    </main>


    <script type="module">

        import * as pdfjsLib
            from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";


        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";


        const pdfInput = document.getElementById("pdfInput");

        const uploadBox = document.getElementById("uploadBox");

        const editor = document.getElementById("editor");

        const canvas = document.getElementById("pdfCanvas");

        const ctx = canvas.getContext("2d");

        const pageWrapper = document.getElementById("pageWrapper");

        const textLayer = document.getElementById("textLayer");
        const drawingLayer =
            document.getElementById("drawingLayer");

        const drawingCtx =
            drawingLayer.getContext("2d");

        const drawBtn =
            document.getElementById("drawBtn");

        const highlightBtn =
            document.getElementById("highlightBtn");

        const clearDrawingsBtn =
            document.getElementById("clearDrawingsBtn");

        const shapeBtn =
            document.getElementById("shapeBtn");

        const shapeType =
            document.getElementById("shapeType");

        const drawingColor =
            document.getElementById("drawingColor");
        const brushSize =
            document.getElementById("brushSize");
        const brushSizeValue =
            document.getElementById("brushSizeValue");
        const highlightColor =
            document.getElementById("highlightColor");
        const highlightOpacity =
            document.getElementById("highlightOpacity");
        const highlightOpacityValue =
            document.getElementById("highlightOpacityValue");

        let shapeMode = false;
        let shapeStartX = 0;
        let shapeStartY = 0;
        let previewImage = null;

        let drawingMode = false;
        let highlightMode = false;
        let isDrawing = false;

        const pageDrawings = {};
        let drawingPageWidth = 0;
        let drawingPageHeight = 0;

        const prevBtn = document.getElementById("prevBtn");

        const nextBtn = document.getElementById("nextBtn");

        const zoomIn = document.getElementById("zoomIn");

        const zoomOut = document.getElementById("zoomOut");

        const resetZoom = document.getElementById("resetZoom");

        const addTextBtn = document.getElementById("addTextBtn");

        const textControls = document.getElementById("textControls");

        const fontSizeInput = document.getElementById("fontSize");

        const pageInfo = document.getElementById("pageInfo");

        const status = document.getElementById("status");

        const textDialog = document.getElementById("textDialog");
        const textInput = document.getElementById("textInput");
        const insertTextBtn = document.getElementById("insertTextBtn");
        const cancelTextBtn = document.getElementById("cancelTextBtn");

        let pendingTextX = 0;
        let pendingTextY = 0;

        let pdfDoc = null;

        let currentPage = 1;

        let scale = 1.3;

        let addTextMode = false;

        let selectedText = null;


        /*
            Store text objects separately.
            Each page gets its own array.
        */

        const pageTexts = {};


        /* Initial interaction state */
        setMode("none");

        /* Upload */

        uploadBox.addEventListener("click", function (e) {

            if (e.target.tagName !== "LABEL") {

                pdfInput.click();

            }

        });


        /* PDF selected */

        pdfInput.addEventListener("change", async function () {

            const file = pdfInput.files[0];

            if (!file) return;

            if (file.type !== "application/pdf") {

                status.textContent = "Please select a PDF file.";

                return;
            }

            status.textContent = "Loading PDF...";

            try {

                const arrayBuffer = await file.arrayBuffer();

                pdfDoc = await pdfjsLib.getDocument({
                    data: arrayBuffer
                }).promise;

                currentPage = 1;

                pageTexts[currentPage] = [];

                uploadBox.style.display = "none";

                editor.style.display = "block";

                status.textContent =
                    `${pdfDoc.numPages} page${pdfDoc.numPages > 1 ? "s" : ""} loaded.`;

                await renderPage(currentPage);

            } catch (error) {

                console.error(error);

                status.textContent =
                    "Could not open this PDF.";

            }

        });


        /* Render PDF page */

        async function renderPage(pageNumber) {

            if (!pdfDoc) return;

            const page = await pdfDoc.getPage(pageNumber);

            const viewport = page.getViewport({
                scale: scale
            });

            canvas.width = viewport.width;

            canvas.height = viewport.height;

            pageWrapper.style.width = viewport.width + "px";

            pageWrapper.style.height = viewport.height + "px";

            textLayer.style.width = viewport.width + "px";

            textLayer.style.height = viewport.height + "px";
            drawingLayer.width = viewport.width;
            drawingLayer.height = viewport.height;

            drawingLayer.style.width =
                viewport.width + "px";

            drawingLayer.style.height =
                viewport.height + "px";

            drawingCtx.clearRect(
                0,
                0,
                drawingLayer.width,
                drawingLayer.height
            );

            /* Restore this page's markings when returning to it.
               Markings are stored as an image snapshot so page changes
               do not erase them. */
            const savedDrawing = pageDrawings[currentPage];
            if (savedDrawing && savedDrawing.width === viewport.width && savedDrawing.height === viewport.height) {
                drawingCtx.drawImage(savedDrawing.image, 0, 0);
            }
            drawingPageWidth = viewport.width;
            drawingPageHeight = viewport.height;

            await page.render({

                canvasContext: ctx,

                viewport: viewport

            }).promise;


            pageInfo.textContent =
                `Page ${currentPage} / ${pdfDoc.numPages}`;


            prevBtn.disabled = currentPage <= 1;

            nextBtn.disabled =
                currentPage >= pdfDoc.numPages;


            renderTexts();

        }


        /* Render text overlays */

        function renderTexts() {

            textLayer.innerHTML = "";

            const texts = pageTexts[currentPage] || [];

            texts.forEach((item, index) => {

                const element = document.createElement("div");

                element.className = "text-item";

                element.textContent = item.text;

                element.style.left = item.x + "px";

                element.style.top = item.y + "px";

                element.style.fontSize =
                    item.size + "px";


                if (selectedText === item) {

                    element.classList.add("selected");

                }


                const deleteButton =
                    document.createElement("span");

                deleteButton.className =
                    "delete-text";

                deleteButton.textContent = "Delete";


                deleteButton.addEventListener("click", function (e) {

                    e.stopPropagation();

                    texts.splice(index, 1);

                    selectedText = null;

                    renderTexts();

                });


                element.appendChild(deleteButton);


                /* Select text */

                element.addEventListener("click", function (e) {

                    e.stopPropagation();

                    selectedText = item;

                    fontSizeInput.value = item.size;

                    renderTexts();

                });


                /* Drag text */

                let dragging = false;

                let offsetX = 0;

                let offsetY = 0;


                element.addEventListener("mousedown", function (e) {

                    if (e.target.classList.contains("delete-text")) {
                        return;
                    }

                    dragging = true;

                    offsetX =
                        e.clientX - element.getBoundingClientRect().left;

                    offsetY =
                        e.clientY - element.getBoundingClientRect().top;

                    selectedText = item;

                });


                document.addEventListener("mousemove", function (e) {

                    if (!dragging) return;

                    const rect =
                        textLayer.getBoundingClientRect();

                    item.x =
                        e.clientX - rect.left - offsetX;

                    item.y =
                        e.clientY - rect.top - offsetY;

                    element.style.left =
                        item.x + "px";

                    element.style.top =
                        item.y + "px";

                });


                document.addEventListener("mouseup", function () {

                    dragging = false;

                });


                textLayer.appendChild(element);

            });

        }


        /* Click PDF to create text */

        pageWrapper.addEventListener("click", function (e) {
            if (!addTextMode) return;

            if (e.target.closest(".text-item")) {
                return;
            }

            const rect = pageWrapper.getBoundingClientRect();

            pendingTextX = e.clientX - rect.left;
            pendingTextY = e.clientY - rect.top;

            textInput.value = "";
            textDialog.classList.add("show");

            setTimeout(function () {
                textInput.focus();
            }, 0);
        });

        insertTextBtn.addEventListener("click", function () {
            const value = textInput.value.trim();

            if (!value) {
                textInput.focus();
                return;
            }

            const size =
                parseInt(fontSizeInput.value) || 18;

            if (!pageTexts[currentPage]) {
                pageTexts[currentPage] = [];
            }

            const item = {
                text: value,
                x: pendingTextX,
                y: pendingTextY,
                size: size
            };

            pageTexts[currentPage].push(item);
            selectedText = item;

            textDialog.classList.remove("show");

            /* Finish the one-time Add Text action.
               Further PDF clicks should not create another text box. */
            setMode("none");

            renderTexts();
        });

        cancelTextBtn.addEventListener("click", function () {
            textDialog.classList.remove("show");
        });

        textDialog.addEventListener("click", function (e) {
            if (e.target === textDialog) {
                textDialog.classList.remove("show");
            }
        });

        textInput.addEventListener("keydown", function (e) {
            if (e.key === "Enter") {
                e.preventDefault();
                insertTextBtn.click();
            }

            if (e.key === "Escape") {
                textDialog.classList.remove("show");
            }
        });

        /* Click elsewhere to apply settings / deselect text */

        pageWrapper.addEventListener("click", function (e) {
            if (e.target.closest(".text-item")) {
                return;
            }

            if (selectedText) {
                selectedText = null;
                renderTexts();
            }
        });

        /* Font size change */

        fontSizeInput.addEventListener("change", function () {

            if (!selectedText) return;

            selectedText.size =
                parseInt(fontSizeInput.value) || 18;

            renderTexts();

        });


        /* Previous */

        prevBtn.addEventListener("click", async function () {

            if (currentPage <= 1) return;

            currentPage--;

            selectedText = null;

            await renderPage(currentPage);

        });


        /* Next */

        nextBtn.addEventListener("click", async function () {

            if (currentPage >= pdfDoc.numPages) return;

            currentPage++;

            selectedText = null;

            await renderPage(currentPage);

        });


        /* Zoom */

        zoomIn.addEventListener("click", function () {

            scale += 0.2;

            renderPage(currentPage);

        });


        zoomOut.addEventListener("click", function () {

            if (scale <= 0.6) return;

            scale -= 0.2;

            renderPage(currentPage);

        });


        resetZoom.addEventListener("click", function () {

            scale = 1.3;

            renderPage(currentPage);

        });


        /* Drawing controls */

        brushSize.addEventListener("input", function () {
            brushSizeValue.textContent = brushSize.value;
        });

        highlightOpacity.addEventListener("input", function () {
            highlightOpacityValue.textContent = highlightOpacity.value + "%";
        });

        /* Download */

        document.getElementById("downloadBtn")
            .addEventListener("click", function () {

                alert(
                    "PDF export will be added after the editing tools are completed."
                );

            });
        /* =========================
           DRAW / HIGHLIGHT / SHAPES
           Unified interaction system
        ========================= */

        function setMode(mode) {
            addTextMode = mode === "text";
            drawingMode = mode === "draw";
            highlightMode = mode === "highlight";
            shapeMode = mode === "shape";

            addTextBtn.classList.toggle("active", addTextMode);
            drawBtn.classList.toggle("active", drawingMode);
            highlightBtn.classList.toggle("active", highlightMode);
            shapeBtn.classList.toggle("active", shapeMode);
            shapeType.disabled = !shapeMode;

            textControls.style.display = addTextMode ? "flex" : "none";

            if (drawingMode || highlightMode || shapeMode) {
                drawingLayer.style.pointerEvents = "auto";
                textLayer.style.pointerEvents = "none";
                pageWrapper.classList.add("drawing-active");
            } else {
                drawingLayer.style.pointerEvents = "none";
                textLayer.style.pointerEvents = "auto";
                pageWrapper.classList.remove("drawing-active");
            }

            if (mode === "text") {
                status.textContent =
                    "Click anywhere on the PDF to add text.";
            } else if (mode === "draw") {
                status.textContent =
                    "Drag anywhere on the PDF to draw.";
            } else if (mode === "highlight") {
                status.textContent =
                    "Drag over the PDF to highlight.";
            } else if (mode === "shape") {
                status.textContent =
                    "Drag on the PDF to create a shape.";
            } else {
                status.textContent = "";
            }
        }

        addTextBtn.addEventListener("click", function () {
            setMode(addTextMode ? "none" : "text");
        });

        drawBtn.addEventListener("click", function () {
            setMode(drawingMode ? "none" : "draw");
        });

        highlightBtn.addEventListener("click", function () {
            setMode(highlightMode ? "none" : "highlight");
        });

        shapeBtn.addEventListener("click", function () {
            setMode(shapeMode ? "none" : "shape");
        });

        /*
            The drawing canvas is only an interaction surface while
            Draw, Highlight, or Shapes is active. All pointer handling
            is intentionally centralized here so the tools cannot
            interfere with each other.
        */

        drawingLayer.addEventListener("pointerdown", function (e) {
            if (!drawingMode && !highlightMode && !shapeMode) {
                return;
            }

            const rect = drawingLayer.getBoundingClientRect();

            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            isDrawing = true;
            drawingLayer.setPointerCapture(e.pointerId);

            if (shapeMode) {
                shapeStartX = x;
                shapeStartY = y;

                previewImage = drawingCtx.getImageData(
                    0,
                    0,
                    drawingLayer.width,
                    drawingLayer.height
                );

                return;
            }

            drawingCtx.beginPath();
            drawingCtx.moveTo(x, y);

            if (highlightMode) {
                drawingCtx.globalAlpha = Number(highlightOpacity.value) / 100;
                drawingCtx.strokeStyle = highlightColor.value;
                drawingCtx.lineWidth = Math.max(8, Number(brushSize.value) * 4);
            } else {
                drawingCtx.globalAlpha = 1;
                drawingCtx.strokeStyle = drawingColor.value;
                drawingCtx.lineWidth = Number(brushSize.value);
            }

            drawingCtx.lineCap = "round";
            drawingCtx.lineJoin = "round";
        });

        drawingLayer.addEventListener("pointermove", function (e) {
            if (!isDrawing) {
                return;
            }

            const rect = drawingLayer.getBoundingClientRect();

            const currentX = e.clientX - rect.left;
            const currentY = e.clientY - rect.top;

            if (shapeMode) {
                if (!previewImage) {
                    return;
                }

                drawingCtx.putImageData(previewImage, 0, 0);

                drawingCtx.globalAlpha = 1;
                drawingCtx.strokeStyle = drawingColor.value;
                drawingCtx.lineWidth = Number(brushSize.value);
                drawingCtx.lineCap = "round";

                const type = shapeType.value;

                if (type === "rectangle") {
                    const width = currentX - shapeStartX;
                    const height = currentY - shapeStartY;

                    drawingCtx.strokeRect(
                        shapeStartX,
                        shapeStartY,
                        width,
                        height
                    );
                } else if (type === "circle") {
                    const radiusX =
                        Math.abs(currentX - shapeStartX) / 2;

                    const radiusY =
                        Math.abs(currentY - shapeStartY) / 2;

                    const centerX =
                        Math.min(shapeStartX, currentX) + radiusX;

                    const centerY =
                        Math.min(shapeStartY, currentY) + radiusY;

                    drawingCtx.beginPath();

                    drawingCtx.ellipse(
                        centerX,
                        centerY,
                        radiusX,
                        radiusY,
                        0,
                        0,
                        Math.PI * 2
                    );

                    drawingCtx.stroke();
                } else if (type === "line") {
                    drawingCtx.beginPath();

                    drawingCtx.moveTo(
                        shapeStartX,
                        shapeStartY
                    );

                    drawingCtx.lineTo(
                        currentX,
                        currentY
                    );

                    drawingCtx.stroke();
                } else if (type === "arrow") {
                    drawArrow(
                        shapeStartX,
                        shapeStartY,
                        currentX,
                        currentY
                    );
                }

                return;
            }

            drawingCtx.lineTo(currentX, currentY);
            drawingCtx.stroke();

            drawingCtx.beginPath();
            drawingCtx.moveTo(currentX, currentY);
        });

        function finishDrawing(e) {
            if (!isDrawing) {
                return;
            }

            isDrawing = false;

            drawingCtx.closePath();
            drawingCtx.globalAlpha = 1;
            previewImage = null;

            /* Save current page markings. */
            const savedCanvas = document.createElement("canvas");
            savedCanvas.width = drawingLayer.width;
            savedCanvas.height = drawingLayer.height;
            savedCanvas.getContext("2d").drawImage(drawingLayer, 0, 0);
            pageDrawings[currentPage] = {
                image: savedCanvas,
                width: drawingLayer.width,
                height: drawingLayer.height
            };

            if (e && drawingLayer.hasPointerCapture(e.pointerId)) {
                drawingLayer.releasePointerCapture(e.pointerId);
            }
        }

        drawingLayer.addEventListener("pointerup", finishDrawing);

        drawingLayer.addEventListener("pointercancel", finishDrawing);

        /* Clear markings */

        clearDrawingsBtn.addEventListener(
            "click",
            function () {
                drawingCtx.clearRect(
                    0,
                    0,
                    drawingLayer.width,
                    drawingLayer.height
                );

                delete pageDrawings[currentPage];
                isDrawing = false;
                previewImage = null;
                drawingCtx.globalAlpha = 1;

                status.textContent =
                    "Drawings and highlights cleared from this page.";
            }
        );

        /* Arrow helper */

        function drawArrow(
            startX,
            startY,
            endX,
            endY
        ) {

            const headLength = 14;

            const angle =
                Math.atan2(
                    endY - startY,
                    endX - startX
                );


            drawingCtx.beginPath();

            drawingCtx.moveTo(
                startX,
                startY
            );

            drawingCtx.lineTo(
                endX,
                endY
            );

            drawingCtx.stroke();


            drawingCtx.beginPath();

            drawingCtx.moveTo(
                endX,
                endY
            );

            drawingCtx.lineTo(
                endX -
                headLength *
                Math.cos(angle - Math.PI / 6),

                endY -
                headLength *
                Math.sin(angle - Math.PI / 6)
            );

            drawingCtx.moveTo(
                endX,
                endY
            );

            drawingCtx.lineTo(
                endX -
                headLength *
                Math.cos(angle + Math.PI / 6),

                endY -
                headLength *
                Math.sin(angle + Math.PI / 6)
            );

            drawingCtx.stroke();

        }
    </script>

</body>
